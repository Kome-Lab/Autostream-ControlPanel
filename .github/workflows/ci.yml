name: autostream-control-panel CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-panel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  service-installer:
    name: Service installer migration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4.12@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_DATABASE: autostream_ci
          MARIADB_USER: autostream_ci
          MARIADB_PASSWORD: autostream-ci-password
          MARIADB_ROOT_PASSWORD: autostream-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check service installer integration test syntax
        run: bash -n release/test-install-autostream-control-panel-integration.sh
      - name: Check Bundle 4 migration contract syntax
        run: bash -n release/test-control-platform-migration-contract.sh
      - name: Test Bundle 4 service-installer migration contract
        run: bash release/test-control-platform-migration-contract.sh
      - name: Test Bundle 4 migration against MariaDB
        shell: bash
        env:
          AUTOSTREAM_MARIADB_TEST_DSN: autostream_ci:autostream-ci-password@tcp(127.0.0.1:3306)/autostream_ci?parseTime=true
        run: |
          set -euo pipefail
          mapfile -t discovered < <(
            go test ./internal/database -list '^TestMariaDBControlPlatformFeatureMigrationAndPersistence$' |
              LC_ALL=C grep '^Test'
          )
          if [[ "${#discovered[@]}" -ne 1 || "${discovered[0]}" != "TestMariaDBControlPlatformFeatureMigrationAndPersistence" ]]; then
            echo "Bundle 4 MariaDB witness denominator mismatch: ${#discovered[@]}/1" >&2
            exit 1
          fi
          result="${RUNNER_TEMP}/bundle4-service-installer-mariadb.json"
          go test ./internal/database \
            -run '^TestMariaDBControlPlatformFeatureMigrationAndPersistence$' \
            -count=1 \
            -json | tee "${result}"
          if jq -e 'select(.Action == "skip" and .Test == "TestMariaDBControlPlatformFeatureMigrationAndPersistence")' "${result}" >/dev/null; then
            echo "Bundle 4 MariaDB witness was skipped" >&2
            exit 1
          fi
          jq -e 'select(.Action == "pass" and .Package == "github.com/example/autostream-control-panel/internal/database" and .Test == "TestMariaDBControlPlatformFeatureMigrationAndPersistence")' "${result}" >/dev/null
          jq -e 'select(.Action == "pass" and .Package == "github.com/example/autostream-control-panel/internal/database" and ((.Test // "") == ""))' "${result}" >/dev/null
      - name: Test fresh install, legacy migration, idempotence, and rollback
        run: sudo bash release/test-install-autostream-control-panel-integration.sh

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # Fixed signed application sources; workflow revisions are recorded separately.
      ST_PORT_UPDATER_SHA: 625c6bed09051b1013226996abccb1ba11074e11
      ST_PORT_CONTRACTS_SHA: 612ceb539ee74180beae682c4290aba54c49c389
      ST_PORT_WORKER_SHA: ba226489b037d5d29e47b72ab054484a57dea3ac
      GOMAXPROCS: "2"
    outputs:
      st_port_source_set: ${{ steps.st_port_sources.outputs.source_set }}
    services:
      mariadb:
        image: mariadb:11.4.12@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_DATABASE: autostream_ci
          MARIADB_USER: autostream_ci
          MARIADB_PASSWORD: autostream-ci-password
          MARIADB_ROOT_PASSWORD: autostream-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check service installer syntax
        run: bash -n release/install-autostream-control-panel
      - name: Test Bundle 4 five-task witnesses
        shell: bash
        run: |
          set -euo pipefail
          witness_count=0
          run_witness() {
            local task_id=$1
            shift
            while (( $# > 0 )); do
              local package=$1
              local pattern=$2
              shift 2
              mapfile -t discovered < <(
                go test "${package}" -list "${pattern}" |
                  LC_ALL=C grep '^Test'
              )
              if [[ "${#discovered[@]}" -eq 0 ]]; then
                echo "${task_id}: zero focused tests discovered for ${package} ${pattern}" >&2
                exit 1
              fi
              printf '%s witness: %s %s tests=%d\n' \
                "${task_id}" "${package}" "${pattern}" "${#discovered[@]}"
              go test "${package}" -run "${pattern}" -count=1
            done
            witness_count=$((witness_count + 1))
          }
          run_witness CONTROL-MEDIA-ASSETS-001 \
            ./internal/mediaassets '^Test(Processor|Variant|MemoryRepository)' \
            ./internal/httpapi '^TestMediaAssetHTTP'
          run_witness CONTROL-USER-THEMES-001 \
            ./internal/store '^TestUserUIPreference' \
            ./internal/httpapi '^TestUIPreferenceAPI'
          run_witness CONTROL-DISCORD-TARGET-PRESETS-001 \
            ./internal/store '^TestDiscordTargetPreset' \
            ./internal/httpapi '^TestDiscordTargetPresetHTTP'
          run_witness CONTROL-STREAM-VISUAL-SETTINGS-001 \
            ./internal/streamvisual '^Test(Update|PresetMode|HeaderTitle|Readiness)' \
            ./internal/httpapi '^Test(StreamStartAndReadiness|StreamVisualSettingsHTTP)'
          run_witness CONTROL-VIDEO-COVER-ORCHESTRATION-001 \
            ./internal/videocover '^Test(Desired|Hide|VideoCoverPreset)' \
            ./internal/httpapi '^TestVideoCoverHTTP'
          if [[ "${witness_count}" -ne 5 ]]; then
            echo "Bundle 4 witness denominator mismatch: ${witness_count}/5" >&2
            exit 1
          fi
          echo "Bundle 4 semantic test witnesses PASS: 5/5, zero denominator=0"
      - name: Verify embedded Updater runtime is absent
        run: bash scripts/ci/verify-no-embedded-updater.sh
      - name: Check out the exact Encoder archive migrator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kome-Lab/Autostream-Encoder-Recorder
          ref: ccbf0c338979a2ad3d7a3b1e1e002adbdec9865d
          path: .bundle8b-archive-encoder
          persist-credentials: false
      - name: Build the filesystem migration witness
        working-directory: .bundle8b-archive-encoder
        run: go build -p 1 -o "${RUNNER_TEMP}/archive-migrator" ./cmd/encoder-recorder
      - name: Test archive mapping and EOL recovery in a fresh database per parent
        timeout-minutes: 15
        shell: bash
        env:
          AUTOSTREAM_MARIADB_CI_CONTAINER: ${{ job.services.mariadb.id }}
          AUTOSTREAM_MARIADB_CI_ROOT_PASSWORD: autostream-ci-root-password
          AUTOSTREAM_ARCHIVE_MIGRATOR_BINARY: ${{ runner.temp }}/archive-migrator
        run: bash scripts/ci/test-bundle8b-review-mariadb.sh
      - name: Upload Bundle 8B repair regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle8b-review-${{ github.sha }}
          path: ${{ runner.temp }}/bundle8b-review/
          if-no-files-found: error
          retention-days: 14
      - name: Test Bundle 8B physical EOL migration against MariaDB
        shell: bash
        env:
          AUTOSTREAM_MARIADB_TEST_DSN: autostream_ci:autostream-ci-password@tcp(127.0.0.1:3306)/autostream_ci?parseTime=true
        run: |
          set -euo pipefail
          mapfile -t discovered < <(
            go test ./internal/database -list '^TestBundle8BPhysicalEOLMigrationMariaDB$' |
              LC_ALL=C grep '^Test'
          )
          if [[ "${#discovered[@]}" -ne 1 || "${discovered[0]}" != "TestBundle8BPhysicalEOLMigrationMariaDB" ]]; then
            echo "Bundle 8B MariaDB witness denominator mismatch: ${#discovered[@]}/1" >&2
            exit 1
          fi
          result="${RUNNER_TEMP}/bundle8b-physical-eol-mariadb.json"
          go test ./internal/database \
            -run '^TestBundle8BPhysicalEOLMigrationMariaDB$' \
            -count=1 \
            -json | tee "${result}"
          if jq -e 'select(.Action == "skip" and .Test == "TestBundle8BPhysicalEOLMigrationMariaDB")' "${result}" >/dev/null; then
            echo "Bundle 8B MariaDB witness was skipped" >&2
            exit 1
          fi
          jq -e 'select(.Action == "pass" and .Package == "github.com/example/autostream-control-panel/internal/database" and .Test == "TestBundle8BPhysicalEOLMigrationMariaDB")' "${result}" >/dev/null
          jq -e 'select(.Action == "pass" and .Package == "github.com/example/autostream-control-panel/internal/database" and ((.Test // "") == ""))' "${result}" >/dev/null
      - run: go test ./...
      - name: Test MariaDB persistence
        shell: bash
        env:
          AUTOSTREAM_MARIADB_TEST_DSN: autostream_ci:autostream-ci-password@tcp(127.0.0.1:3306)/autostream_ci?parseTime=true
          # Existing disposable service administrator; never used by mutation transactions.
          AUTOSTREAM_MARIADB_LOCK_DIAGNOSTIC_DSN: root:autostream-ci-root-password@tcp(127.0.0.1:3306)/autostream_ci?parseTime=true
        run: |
          set -euo pipefail
          mapfile -t mariadb_tests < <(
            go test ./internal/store -list '^TestMariaDB' |
              LC_ALL=C grep '^TestMariaDB'
          )
          if [[ "${#mariadb_tests[@]}" -eq 0 ]]; then
            echo "No TestMariaDB integration tests were discovered" >&2
            exit 1
          fi
          printf 'Discovered MariaDB integration test: %s\n' "${mariadb_tests[@]}"
          mkdir -p "${RUNNER_TEMP}/st-port-store-evidence"
          result="${RUNNER_TEMP}/st-port-store-evidence/mariadb-store-tests.json"
          go test ./internal/store \
            -run '^TestMariaDB' \
            -count=1 \
            -json | tee "${result}"
          if jq -e \
            'select(.Action == "skip" and ((.Test // "") | startswith("TestMariaDB")))' \
            "${result}" > /dev/null; then
            echo "A MariaDB integration test was skipped" >&2
            exit 1
          fi
          for test_name in "${mariadb_tests[@]}"; do
            if ! jq -e \
              --arg test_name "${test_name}" \
              'select(
                .Action == "pass" and
                .Package == "github.com/example/autostream-control-panel/internal/store" and
                .Test == $test_name
              )' \
              "${result}" > /dev/null; then
              echo "MariaDB integration test did not report pass: ${test_name}" >&2
              exit 1
            fi
          done
          jq -e \
            'select(.Action == "pass" and .Package == "github.com/example/autostream-control-panel/internal/store" and ((.Test // "") == ""))' \
            "${result}" > /dev/null
      - name: Test MariaDB OAuth and Configure Token migrations
        shell: bash
        env:
          AUTOSTREAM_MARIADB_TEST_DSN: autostream_ci:autostream-ci-password@tcp(127.0.0.1:3306)/autostream_ci?parseTime=true
        run: |
          set -euo pipefail
          mapfile -t migration_tests < <(
            go test ./internal/database -list '^TestMariaDB' |
              LC_ALL=C grep '^TestMariaDB' | grep -v '^TestMariaDBBundle8B'
          )
          if [[ "${#migration_tests[@]}" -eq 0 ]]; then
            echo "No MariaDB migration integration tests were discovered" >&2
            exit 1
          fi
          printf 'Discovered MariaDB migration test: %s\n' "${migration_tests[@]}"
          result="${RUNNER_TEMP}/mariadb-migration-tests.json"
          # Bundle 8B repair parents run above, each against their own empty DB.
          migration_pattern="^($(IFS='|'; echo "${migration_tests[*]}"))$"
          go test ./internal/database \
            -run "${migration_pattern}" \
            -count=1 \
            -json | tee "${result}"
          if jq -e \
            'select(.Action == "skip" and ((.Test // "") | startswith("TestMariaDB")))' \
            "${result}" > /dev/null; then
            echo "A MariaDB migration integration test was skipped" >&2
            exit 1
          fi
          for test_name in "${migration_tests[@]}"; do
            if ! jq -e \
              --arg test_name "${test_name}" \
              'select(
                .Action == "pass" and
                .Package == "github.com/example/autostream-control-panel/internal/database" and
                .Test == $test_name
              )' \
              "${result}" > /dev/null; then
              echo "MariaDB migration integration test did not report pass: ${test_name}" >&2
              exit 1
            fi
          done
          jq -e \
            'select(.Action == "pass" and .Package == "github.com/example/autostream-control-panel/internal/database" and ((.Test // "") == ""))' \
            "${result}" > /dev/null
      - name: Test backup script with root-owned Linux fixtures
        run: |
          docker run --rm \
            --user 0:0 \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 256m \
            --cpus 1 \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \
            /bin/bash /workspace/internal/security/testdata/run-backup-script-root-smoke.sh \
              /workspace/release/autostream-backup-control-panel.example \
              /var/backups/autostream/control-panel \
              autostream_control_panel \
              autostream-kometubu_panel
      - run: go build ./...

      - name: Check out pinned ST-PORT Updater acceptance source
        if: always() && !cancelled()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kome-Lab/Autostream-Updater
          ref: ${{ env.ST_PORT_UPDATER_SHA }}
          path: st-port-updater
          persist-credentials: false
      - name: Check out pinned Worker runtime fixture source
        if: always() && !cancelled()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kome-Lab/Autostream-Worker
          ref: ${{ env.ST_PORT_WORKER_SHA }}
          path: st-port-worker
          persist-credentials: false
      - name: Require the ST-PORT source set and entrypoints
        id: st_port_sources
        if: always() && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C st-port-updater rev-parse HEAD)" = "${ST_PORT_UPDATER_SHA}"
          test "$(git -C st-port-worker rev-parse HEAD)" = "${ST_PORT_WORKER_SHA}"
          test -f internal/httpapi/st_port_full_chain_process_linux_test.go
          test -f scripts/ci/required-st-port-store-tests.txt
          test -f st-port-updater/scripts/ci/run-st-port-full-chain.sh
          test -f st-port-updater/scripts/ci/required-st-port-full-chain-tests.txt
          test -f st-port-updater/scripts/ci/required-st-port-docker-full-chain-tests.txt
          test -f st-port-updater/scripts/ci/verify-go-test-evidence.py
          for directory in . st-port-updater; do
            (
              cd "${directory}"
              dependency="$(go list -m -f '{{.Replace.Version}}' github.com/example/autostream-contracts)"
              [[ "${dependency}" == *-"${ST_PORT_CONTRACTS_SHA:0:12}" ]]
            )
          done
          source_set="$(jq -cn \
            --arg control_panel_sha "${GITHUB_SHA}" \
            --arg updater_sha "${ST_PORT_UPDATER_SHA}" \
            --arg contracts_sha "${ST_PORT_CONTRACTS_SHA}" \
            --arg worker_sha "${ST_PORT_WORKER_SHA}" \
            '{control_panel_sha:$control_panel_sha,updater_sha:$updater_sha,contracts_sha:$contracts_sha,worker_sha:$worker_sha}')"
          printf 'source_set=%s\n' "${source_set}" >> "${GITHUB_OUTPUT}"
      - name: Require ST-PORT Store parity, collision, and commit crash evidence
        id: st_port_store
        if: always() && !cancelled()
        shell: bash
        run: |
          bash st-port-updater/scripts/ci/verify-go-test-evidence.sh --exact-subtests \
            "${RUNNER_TEMP}/st-port-store-evidence" \
            "${GITHUB_WORKSPACE}/internal/store" \
            scripts/ci/required-st-port-store-tests.txt
      - name: Run ST-PORT through real CP, MariaDB, Agent, and root
        id: st_port_full_chain
        if: always() && !cancelled() && steps.st_port_sources.outcome == 'success'
        timeout-minutes: 40
        shell: bash
        env:
          AUTOSTREAM_MARIADB_TEST_DSN: autostream_ci:autostream-ci-password@tcp(127.0.0.1:3306)/autostream_ci?parseTime=true
          AUTOSTREAM_ST_PORT_EXPECTED_SOURCE_SET: ${{ steps.st_port_sources.outputs.source_set }}
          AUTOSTREAM_ST_PORT_WORKER_VERSION: v2.0.0
          AUTOSTREAM_ST_PORT_CONTROL_PANEL_SHA: ${{ github.sha }}
          AUTOSTREAM_ST_PORT_UPDATER_SHA: ${{ env.ST_PORT_UPDATER_SHA }}
          AUTOSTREAM_ST_PORT_CONTRACTS_SHA: ${{ env.ST_PORT_CONTRACTS_SHA }}
          AUTOSTREAM_ST_PORT_WORKER_SHA: ${{ env.ST_PORT_WORKER_SHA }}
        run: |
          set -euo pipefail
          binaries="${RUNNER_TEMP}/st-port-binaries"
          mkdir -p "${binaries}"
          go test -p 1 -c -o "${binaries}/control-panel.test" ./internal/httpapi
          (
            cd st-port-worker
            build_date="$(git show -s --format=%cI "${ST_PORT_WORKER_SHA}")"
            go build -p 1 -trimpath \
              -ldflags "-X github.com/example/autostream-worker/internal/version.Version=${AUTOSTREAM_ST_PORT_WORKER_VERSION} -X github.com/example/autostream-worker/internal/version.Commit=${ST_PORT_WORKER_SHA} -X github.com/example/autostream-worker/internal/version.BuildDate=${build_date}" \
              -o "${binaries}/worker" ./cmd/worker
          )
          (
            cd st-port-updater
            bash scripts/ci/run-st-port-full-chain.sh \
              "${binaries}/control-panel.test" "${binaries}/worker" \
              "${RUNNER_TEMP}/st-port-full-chain-evidence"
          )
      - name: Require complete ST-PORT full-chain test IDs
        id: st_port_full_chain_evidence
        if: always() && !cancelled()
        shell: bash
        run: |
          bash st-port-updater/scripts/ci/verify-go-test-evidence.sh --exact-subtests \
            "${RUNNER_TEMP}/st-port-full-chain-evidence/go" \
            "${GITHUB_WORKSPACE}/st-port-updater/internal/hostruntime" \
            st-port-updater/scripts/ci/required-st-port-full-chain-tests.txt \
            st-port-updater/scripts/ci/required-st-port-docker-full-chain-tests.txt
      - name: Upload ST-PORT Store evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: st-port-store-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/st-port-store-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload ST-PORT full-chain evidence and actual GET projections
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: st-port-full-chain-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/st-port-full-chain-evidence/go/
            ${{ runner.temp }}/st-port-full-chain-evidence/artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Require every ST-PORT lane
        if: always()
        env:
          SOURCES_RESULT: ${{ steps.st_port_sources.outcome }}
          STORE_RESULT: ${{ steps.st_port_store.outcome }}
          FULL_CHAIN_RESULT: ${{ steps.st_port_full_chain.outcome }}
          FULL_CHAIN_EVIDENCE_RESULT: ${{ steps.st_port_full_chain_evidence.outcome }}
        run: |
          set -euo pipefail
          [[ "${SOURCES_RESULT}" == success ]]
          [[ "${STORE_RESULT}" == success ]]
          [[ "${FULL_CHAIN_RESULT}" == success ]]
          [[ "${FULL_CHAIN_EVIDENCE_RESULT}" == success ]]

  release-rehearsal:
    name: Control Panel only release rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build Control Panel only release candidate
        run: |
          bash scripts/ci/build-control-panel-release-candidate.sh \
            v0.0.0 \
            "${GITHUB_SHA}" \
            "${RUNNER_TEMP}/control-panel-release"
      - name: Upload Control Panel release rehearsal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-panel-release-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/control-panel-release/artifacts
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  observability_proxy_race_pre_fix:
    name: Observability proxy race baseline negative fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Initialize bounded proof artifact
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/observability-proxy-race-pre-fix"
          install -d -m 0700 "${proof_dir}"
          printf 'status=not_run\n' > "${proof_dir}/proof.txt"
          chmod 0600 "${proof_dir}/proof.txt"
      - name: Check out current workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact pre-fix authority source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 86261a2e8b839bcf24f8b360d21b3a6c7cfc51da
          path: authority-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: authority-source/go.mod
          cache-dependency-path: authority-source/go.mod
      - name: Reproduce exact-authority Observability proxy race
        shell: bash
        env:
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          authority_sha="86261a2e8b839bcf24f8b360d21b3a6c7cfc51da"
          authority_dir="${GITHUB_WORKSPACE}/authority-source"
          current_test="${GITHUB_WORKSPACE}/internal/httpapi/server_test.go"
          authority_test="${authority_dir}/internal/httpapi/server_test.go"
          proof_dir="${RUNNER_TEMP}/observability-proxy-race-pre-fix"
          proof_log="${proof_dir}/proof.txt"
          raw_log="${RUNNER_TEMP}/observability-proxy-race-pre-fix.raw.log"
          trap 'rm -f "${raw_log}"' EXIT

          current_sha="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          checked_out_authority_sha="$(git -C "${authority_dir}" rev-parse HEAD)"
          current_test_sha256="$(sha256sum "${current_test}" | awk '{print $1}')"
          authority_test_sha256="$(sha256sum "${authority_test}" | awk '{print $1}')"
          test_bytes_equal=false
          if cmp -s "${current_test}" "${authority_test}"; then
            test_bytes_equal=true
          fi

          {
            printf 'status=source_checked\n'
            printf 'authority_sha=%s\n' "${authority_sha}"
            printf 'checked_out_authority_sha=%s\n' "${checked_out_authority_sha}"
            printf 'current_sha=%s\n' "${current_sha}"
            printf 'current_test_sha256=%s\n' "${current_test_sha256}"
            printf 'authority_test_sha256=%s\n' "${authority_test_sha256}"
            printf 'test_bytes_equal=%s\n' "${test_bytes_equal}"
          } > "${proof_log}"

          [[ "${checked_out_authority_sha}" == "${authority_sha}" ]]
          [[ "${test_bytes_equal}" == false ]]

          set +e
          (
            cd "${authority_dir}"
            go test -race -mod=readonly -p 1 ./internal/httpapi \
              -run '^TestObservabilityProxyEndpoints$' \
              -count=20 \
              -timeout=20m
          ) > "${raw_log}" 2>&1
          race_status=$?
          set -e

          race_warning_count="$(grep -F -c 'WARNING: DATA RACE' "${raw_log}" || true)"
          target_function_count="$(grep -F -c 'TestObservabilityProxyEndpoints.func1' "${raw_log}" || true)"
          raw_log_bytes="$(wc -c < "${raw_log}")"
          {
            printf 'status=race_command_completed\n'
            printf 'go_test_exit=%s\n' "${race_status}"
            printf 'race_warning_count=%s\n' "${race_warning_count}"
            printf 'target_function_witness_count=%s\n' "${target_function_count}"
            printf 'raw_log_bytes=%s\n' "${raw_log_bytes}"
            printf 'raw_log_retained=false\n'
          } >> "${proof_log}"
          chmod 0600 "${proof_log}"

          [[ "${race_status}" -ne 0 ]]
          [[ "${race_warning_count}" -ge 1 ]]
          [[ "${target_function_count}" -ge 1 ]]
          [[ "$(wc -c < "${proof_log}")" -le 8192 ]]
      - name: Upload bounded pre-fix race proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-proxy-race-pre-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observability-proxy-race-pre-fix/proof.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  observability_proxy_race_current:
    name: Observability proxy race current-source proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Initialize bounded current-source proof artifact
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/observability-proxy-race-current"
          install -d -m 0700 "${proof_dir}"
          printf 'status=not_run\n' > "${proof_dir}/proof.txt"
          chmod 0600 "${proof_dir}/proof.txt"
      - name: Check out current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify current-source Observability proxy race coverage
        shell: bash
        env:
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/observability-proxy-race-current"
          proof_log="${proof_dir}/proof.txt"
          targeted_log="${RUNNER_TEMP}/observability-proxy-race-current-targeted.raw.log"
          full_race_log="${RUNNER_TEMP}/observability-proxy-race-current-full-race.raw.log"
          normal_log="${RUNNER_TEMP}/observability-proxy-race-current-normal.raw.log"
          trap 'rm -f "${targeted_log}" "${full_race_log}" "${normal_log}"' EXIT

          current_sha="$(git rev-parse HEAD)"
          set +e
          go test -json -race -mod=readonly -p 1 ./internal/httpapi \
            -run '^TestObservabilityProxyEndpoints$' \
            -count=50 \
            -timeout=15m \
            > "${targeted_log}" 2>&1
          targeted_status=$?
          go test -race -mod=readonly -p 1 ./internal/httpapi \
            -count=1 \
            -timeout=20m \
            > "${full_race_log}" 2>&1
          full_race_status=$?
          go test -mod=readonly -p 1 ./internal/httpapi \
            -count=1 \
            -timeout=10m \
            > "${normal_log}" 2>&1
          normal_status=$?
          set -e

          targeted_race_warning_count="$(grep -F -c 'WARNING: DATA RACE' "${targeted_log}" || true)"
          full_race_warning_count="$(grep -F -c 'WARNING: DATA RACE' "${full_race_log}" || true)"
          targeted_test_run_count="$(awk 'index($0, "\"Action\":\"run\"") && index($0, "\"Test\":\"TestObservabilityProxyEndpoints\"") { count++ } END { print count + 0 }' "${targeted_log}")"
          targeted_test_pass_count="$(awk 'index($0, "\"Action\":\"pass\"") && index($0, "\"Test\":\"TestObservabilityProxyEndpoints\"") { count++ } END { print count + 0 }' "${targeted_log}")"
          targeted_log_bytes="$(wc -c < "${targeted_log}")"
          full_race_log_bytes="$(wc -c < "${full_race_log}")"
          normal_log_bytes="$(wc -c < "${normal_log}")"
          {
            printf 'status=current_source_checks_completed\n'
            printf 'current_sha=%s\n' "${current_sha}"
            printf 'targeted_race_exit=%s\n' "${targeted_status}"
            printf 'targeted_race_warning_count=%s\n' "${targeted_race_warning_count}"
            printf 'targeted_test_run_count=%s\n' "${targeted_test_run_count}"
            printf 'targeted_test_pass_count=%s\n' "${targeted_test_pass_count}"
            printf 'targeted_raw_log_bytes=%s\n' "${targeted_log_bytes}"
            printf 'full_package_race_exit=%s\n' "${full_race_status}"
            printf 'full_package_race_warning_count=%s\n' "${full_race_warning_count}"
            printf 'full_package_race_raw_log_bytes=%s\n' "${full_race_log_bytes}"
            printf 'normal_package_exit=%s\n' "${normal_status}"
            printf 'normal_package_raw_log_bytes=%s\n' "${normal_log_bytes}"
            printf 'raw_logs_retained=false\n'
          } > "${proof_log}"
          chmod 0600 "${proof_log}"

          [[ "${targeted_status}" -eq 0 ]]
          [[ "${targeted_race_warning_count}" -eq 0 ]]
          [[ "${targeted_test_run_count}" -eq 50 ]]
          [[ "${targeted_test_pass_count}" -eq 50 ]]
          [[ "${full_race_status}" -eq 0 ]]
          [[ "${full_race_warning_count}" -eq 0 ]]
          [[ "${normal_status}" -eq 0 ]]
          [[ "$(wc -c < "${proof_log}")" -le 8192 ]]
      - name: Upload bounded current-source race proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-proxy-race-current-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observability-proxy-race-current/proof.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: go
    if: always() && !cancelled()
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test Bundle 4 Web semantic witnesses
        run: npm run test:control-platform
      - name: Test Bundle 4 browser witnesses and UI Foundation behavior
        timeout-minutes: 8
        env:
          AUTOSTREAM_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run test:ui-foundation-browser
      - name: Test Bundle 6 Observability and Updater UI witnesses
        run: npm run test:bundle6-witnesses
      - name: Test Bundle 6 migrated action denominator
        run: npm run test:bundle6-features
      - name: Test UI Foundation operations and Bundle 7 denominator
        run: npm run test:ui-foundation-operations
      - run: npm run test:system-updates
      - run: npm run test:stream-regressions
      - run: npm run lint
      - run: npm run build
      - name: Download actual ST-PORT GET evidence from the same source set
        if: always() && !cancelled()
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: st-port-full-chain-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/st-port-full-chain-evidence
      - name: Test actual ST-PORT GET results in the browser
        if: always() && !cancelled()
        timeout-minutes: 8
        env:
          AUTOSTREAM_BROWSER_PATH: /usr/bin/google-chrome
          AUTOSTREAM_ST_PORT_GET_ARTIFACT: ${{ runner.temp }}/st-port-full-chain-evidence/artifacts/st-port-full-chain-web.json
          AUTOSTREAM_ST_PORT_EXPECTED_SOURCE_SET: ${{ needs.go.outputs.st_port_source_set }}
        run: npm run test:st-port-get-browser

  overall:
    name: overall
    if: always()
    needs: [service-installer, go, release-rehearsal, observability_proxy_race_pre_fix, observability_proxy_race_current, web]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every blocking job
        env:
          SERVICE_INSTALLER_RESULT: ${{ needs.service-installer.result }}
          GO_RESULT: ${{ needs.go.result }}
          RELEASE_REHEARSAL_RESULT: ${{ needs.release-rehearsal.result }}
          OBSERVABILITY_PROXY_RACE_PRE_FIX_RESULT: ${{ needs.observability_proxy_race_pre_fix.result }}
          OBSERVABILITY_PROXY_RACE_CURRENT_RESULT: ${{ needs.observability_proxy_race_current.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          set -euo pipefail
          [[ "${SERVICE_INSTALLER_RESULT}" == success ]]
          [[ "${GO_RESULT}" == success ]]
          [[ "${RELEASE_REHEARSAL_RESULT}" == success ]]
          [[ "${OBSERVABILITY_PROXY_RACE_PRE_FIX_RESULT}" == success ]]
          [[ "${OBSERVABILITY_PROXY_RACE_CURRENT_RESULT}" == success ]]
          [[ "${WEB_RESULT}" == success ]]
