name: autostream-control-panel CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-panel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  service-installer:
    name: Service installer migration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4.12@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_DATABASE: autostream_ci
          MARIADB_USER: autostream_ci
          MARIADB_PASSWORD: autostream-ci-password
          MARIADB_ROOT_PASSWORD: autostream-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check service installer integration test syntax
        run: bash -n release/test-install-autostream-control-panel-integration.sh
      - name: Check Bundle 4 migration contract syntax
        run: bash -n release/test-control-platform-migration-contract.sh
      - name: Test Bundle 4 service-installer migration contract
        run: bash release/test-control-platform-migration-contract.sh
      - name: Test Bundle 4 migration against MariaDB
        shell: bash
        env:
          AUTOSTREAM_MARIADB_TEST_DSN: autostream_ci:autostream-ci-password@tcp(127.0.0.1:3306)/autostream_ci?parseTime=true
        run: |
          set -euo pipefail
          mapfile -t discovered < <(
            go test ./internal/database -list '^TestMariaDBControlPlatformFeatureMigrationAndPersistence$' |
              LC_ALL=C grep '^Test'
          )
          if [[ "${#discovered[@]}" -ne 1 || "${discovered[0]}" != "TestMariaDBControlPlatformFeatureMigrationAndPersistence" ]]; then
            echo "Bundle 4 MariaDB witness denominator mismatch: ${#discovered[@]}/1" >&2
            exit 1
          fi
          result="${RUNNER_TEMP}/bundle4-service-installer-mariadb.json"
          go test ./internal/database \
            -run '^TestMariaDBControlPlatformFeatureMigrationAndPersistence$' \
            -count=1 \
            -json | tee "${result}"
          if jq -e 'select(.Action == "skip" and .Test == "TestMariaDBControlPlatformFeatureMigrationAndPersistence")' "${result}" >/dev/null; then
            echo "Bundle 4 MariaDB witness was skipped" >&2
            exit 1
          fi
          jq -e 'select(.Action == "pass" and .Package == "github.com/example/autostream-control-panel/internal/database" and .Test == "TestMariaDBControlPlatformFeatureMigrationAndPersistence")' "${result}" >/dev/null
          jq -e 'select(.Action == "pass" and .Package == "github.com/example/autostream-control-panel/internal/database" and ((.Test // "") == ""))' "${result}" >/dev/null
      - name: Test fresh install, legacy migration, idempotence, and rollback
        run: sudo bash release/test-install-autostream-control-panel-integration.sh
      - name: Check Local Executor systemd sandbox smoke syntax
        run: bash -n internal/security/testdata/run-local-executor-systemd-sandbox-smoke.sh
      - name: Test Local Executor systemd sandbox capabilities
        run: sudo bash internal/security/testdata/run-local-executor-systemd-sandbox-smoke.sh
      - name: Test Local Executor installer boundary
        run: |
          docker run --rm \
            --user 0:0 \
            --network none \
            --pids-limit 128 \
            --memory 256m \
            --cpus 1 \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \
            /bin/bash /workspace/internal/security/testdata/run-local-executor-installer-smoke.sh \
              /workspace

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4.12@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_DATABASE: autostream_ci
          MARIADB_USER: autostream_ci
          MARIADB_PASSWORD: autostream-ci-password
          MARIADB_ROOT_PASSWORD: autostream-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check service installer syntax
        run: bash -n release/install-autostream-control-panel
      - name: Test Bundle 4 five-task witnesses
        shell: bash
        run: |
          set -euo pipefail
          witness_count=0
          run_witness() {
            local task_id=$1
            shift
            while (( $# > 0 )); do
              local package=$1
              local pattern=$2
              shift 2
              mapfile -t discovered < <(
                go test "${package}" -list "${pattern}" |
                  LC_ALL=C grep '^Test'
              )
              if [[ "${#discovered[@]}" -eq 0 ]]; then
                echo "${task_id}: zero focused tests discovered for ${package} ${pattern}" >&2
                exit 1
              fi
              printf '%s witness: %s %s tests=%d\n' \
                "${task_id}" "${package}" "${pattern}" "${#discovered[@]}"
              go test "${package}" -run "${pattern}" -count=1
            done
            witness_count=$((witness_count + 1))
          }
          run_witness CONTROL-MEDIA-ASSETS-001 \
            ./internal/mediaassets '^Test(Processor|Variant|MemoryRepository)' \
            ./internal/httpapi '^TestMediaAssetHTTP'
          run_witness CONTROL-USER-THEMES-001 \
            ./internal/store '^TestUserUIPreference' \
            ./internal/httpapi '^TestUIPreferenceAPI'
          run_witness CONTROL-DISCORD-TARGET-PRESETS-001 \
            ./internal/store '^TestDiscordTargetPreset' \
            ./internal/httpapi '^TestDiscordTargetPresetHTTP'
          run_witness CONTROL-STREAM-VISUAL-SETTINGS-001 \
            ./internal/streamvisual '^Test(Update|PresetMode|HeaderTitle|Readiness)' \
            ./internal/httpapi '^Test(StreamStartAndReadiness|StreamVisualSettingsHTTP)'
          run_witness CONTROL-VIDEO-COVER-ORCHESTRATION-001 \
            ./internal/videocover '^Test(Desired|Hide|VideoCoverPreset)' \
            ./internal/httpapi '^TestVideoCoverHTTP'
          if [[ "${witness_count}" -ne 5 ]]; then
            echo "Bundle 4 witness denominator mismatch: ${witness_count}/5" >&2
            exit 1
          fi
          echo "Bundle 4 semantic test witnesses PASS: 5/5, zero denominator=0"
      - run: go test ./...
      - name: Test production Docker port reconfiguration daemon boundary
        shell: bash
        env:
          AUTOSTREAM_DOCKER_PORT_DAEMON_SMOKE: "1"
        run: |
          set -euo pipefail
          smoke_binary="${RUNNER_TEMP}/updateagent-docker-port.test"
          smoke_fixture="${RUNNER_TEMP}/docker-port-fixture"
          smoke_tmp="${RUNNER_TEMP}/docker-port-root-tmp"
          smoke_cache="${RUNNER_TEMP}/docker-port-root-gocache"
          CGO_ENABLED=0 GOOS=linux \
            go build -trimpath -ldflags="-s -w" \
              -o "${smoke_fixture}" \
              ./internal/updateagent/testdata/docker-port-fixture
          go test -c ./internal/updateagent -o "${smoke_binary}"
          sudo install -d -o root -g root -m 0700 "${smoke_tmp}" "${smoke_cache}"
          cleanup_docker_port_smoke() {
            set +e
            smoke_owner="${smoke_tmp}/.docker-port-smoke-owner"
            if sudo test -f "${smoke_owner}" &&
              sudo grep -qx 'github-actions-docker-port-smoke' "${smoke_owner}"; then
              sudo /usr/bin/docker ps -aq \
                --filter label=com.docker.compose.project=autostream |
                xargs -r sudo /usr/bin/docker rm -f
              sudo /usr/bin/docker ps -aq \
                --filter label=com.kome-lab.autostream.test=docker-port-smoke |
                xargs -r sudo /usr/bin/docker rm -f
              sudo /usr/bin/docker network rm autostream_default >/dev/null 2>&1 || true
              sudo /usr/bin/docker image ls -q \
                --filter label=com.kome-lab.autostream.test=docker-port-smoke |
                xargs -r sudo /usr/bin/docker image rm -f
              sudo rm -f \
                /run/autostream-updater/.autostream-host-lifecycle.lock \
                /run/autostream-updater/.autostream-updater-f7868912f69c.lock \
                "${smoke_owner}"
            fi
          }
          trap cleanup_docker_port_smoke EXIT
          sudo --preserve-env=AUTOSTREAM_DOCKER_PORT_DAEMON_SMOKE \
            /usr/bin/unshare --mount --propagation private \
            /usr/bin/env \
              AUTOSTREAM_DOCKER_PORT_DAEMON_SMOKE_MOUNT_NS=1 \
              AUTOSTREAM_DOCKER_PORT_FIXTURE_BINARY="${smoke_fixture}" \
              HOME=/root \
              PATH="${PATH}" \
              GOCACHE="${smoke_cache}" \
              TMPDIR="${smoke_tmp}" \
              "${smoke_binary}" \
                -test.run '^TestDockerPortDaemonSmoke$' \
                -test.count=1 \
                -test.timeout=8m \
                -test.v
      - name: Test MariaDB persistence
        shell: bash
        env:
          AUTOSTREAM_MARIADB_TEST_DSN: autostream_ci:autostream-ci-password@tcp(127.0.0.1:3306)/autostream_ci?parseTime=true
        run: |
          set -euo pipefail
          mapfile -t mariadb_tests < <(
            go test ./internal/store -list '^TestMariaDB' |
              LC_ALL=C grep '^TestMariaDB'
          )
          if [[ "${#mariadb_tests[@]}" -eq 0 ]]; then
            echo "No TestMariaDB integration tests were discovered" >&2
            exit 1
          fi
          printf 'Discovered MariaDB integration test: %s\n' "${mariadb_tests[@]}"
          result="${RUNNER_TEMP}/mariadb-store-tests.json"
          go test ./internal/store \
            -run '^TestMariaDB' \
            -count=1 \
            -json | tee "${result}"
          if jq -e \
            'select(.Action == "skip" and ((.Test // "") | startswith("TestMariaDB")))' \
            "${result}" > /dev/null; then
            echo "A MariaDB integration test was skipped" >&2
            exit 1
          fi
          for test_name in "${mariadb_tests[@]}"; do
            if ! jq -e \
              --arg test_name "${test_name}" \
              'select(
                .Action == "pass" and
                .Package == "github.com/example/autostream-control-panel/internal/store" and
                .Test == $test_name
              )' \
              "${result}" > /dev/null; then
              echo "MariaDB integration test did not report pass: ${test_name}" >&2
              exit 1
            fi
          done
          jq -e \
            'select(.Action == "pass" and .Package == "github.com/example/autostream-control-panel/internal/store" and ((.Test // "") == ""))' \
            "${result}" > /dev/null
      - name: Test MariaDB OAuth and Configure Token migrations
        shell: bash
        env:
          AUTOSTREAM_MARIADB_TEST_DSN: autostream_ci:autostream-ci-password@tcp(127.0.0.1:3306)/autostream_ci?parseTime=true
        run: |
          set -euo pipefail
          mapfile -t migration_tests < <(
            go test ./internal/database -list '^TestMariaDB' |
              LC_ALL=C grep '^TestMariaDB'
          )
          if [[ "${#migration_tests[@]}" -eq 0 ]]; then
            echo "No MariaDB migration integration tests were discovered" >&2
            exit 1
          fi
          printf 'Discovered MariaDB migration test: %s\n' "${migration_tests[@]}"
          result="${RUNNER_TEMP}/mariadb-migration-tests.json"
          go test ./internal/database \
            -run '^TestMariaDB' \
            -count=1 \
            -json | tee "${result}"
          if jq -e \
            'select(.Action == "skip" and ((.Test // "") | startswith("TestMariaDB")))' \
            "${result}" > /dev/null; then
            echo "A MariaDB migration integration test was skipped" >&2
            exit 1
          fi
          for test_name in "${migration_tests[@]}"; do
            if ! jq -e \
              --arg test_name "${test_name}" \
              'select(
                .Action == "pass" and
                .Package == "github.com/example/autostream-control-panel/internal/database" and
                .Test == $test_name
              )' \
              "${result}" > /dev/null; then
              echo "MariaDB migration integration test did not report pass: ${test_name}" >&2
              exit 1
            fi
          done
          jq -e \
            'select(.Action == "pass" and .Package == "github.com/example/autostream-control-panel/internal/database" and ((.Test // "") == ""))' \
            "${result}" > /dev/null
      - name: Test managed Host config and upgrade locks with root-owned Linux fixtures
        run: |
          set -euo pipefail
          getent group autostream-updater >/dev/null 2>&1 || sudo groupadd --system autostream-updater
          getent group autostream-host-agent >/dev/null 2>&1 || sudo groupadd --system autostream-host-agent
          sudo install -d -o root -g root -m 0700 /root/autostream-updater-root-tests
          root_tests=(
            TestPreparedUpdaterConfig
            TestHostAgentConfigurationTransaction
            TestManualHostUpgradeLocksFenceLegacyUpdateHostInstaller
            TestAcquireManualHostUpgradeTargetLocksInteroperatesWithLegacyTargetLock
            TestHostRuntimeSetupAndLifecycleLocksUsePermanentStrongInodes
          )
          expected_root_mode_skip="TestPreparedUpdaterConfigInitializationRejectsNonRootBeforeFilesystemMutation"
          result="${RUNNER_TEMP}/root-owned-updater-tests.json"
          GOTOOLCHAIN=local GOENV=off GOWORK=off GOPROXY=off \
            go test \
            -mod=readonly \
            -trimpath \
            -exec='/usr/bin/sudo /usr/bin/env -i HOME=/root PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin TMPDIR=/root/autostream-updater-root-tests' \
            ./internal/updateagent \
            -run '^(TestPreparedUpdaterConfig|TestHostAgentConfigurationTransaction|TestManualHostUpgradeLocksFenceLegacyUpdateHostInstaller|TestAcquireManualHostUpgradeTargetLocksInteroperatesWithLegacyTargetLock|TestHostRuntimeSetupAndLifecycleLocksUsePermanentStrongInodes)' \
            -count=1 \
            -timeout=10m \
            -json | tee "${result}"
          if jq -e \
            --arg expected_root_mode_skip "${expected_root_mode_skip}" \
            'select(
              .Action == "skip" and
              .Package == "github.com/example/autostream-control-panel/internal/updateagent" and
              .Test != $expected_root_mode_skip and
              (((.Test // "") | startswith("TestPreparedUpdaterConfig")) or
               ((.Test // "") | startswith("TestHostAgentConfigurationTransaction")) or
               (.Test == "TestManualHostUpgradeLocksFenceLegacyUpdateHostInstaller") or
               (.Test == "TestAcquireManualHostUpgradeTargetLocksInteroperatesWithLegacyTargetLock") or
               (.Test == "TestHostRuntimeSetupAndLifecycleLocksUsePermanentStrongInodes")))' \
            "${result}" > /dev/null; then
            echo "An unexpected root-owned updater test was skipped" >&2
            exit 1
          fi
          if ! jq -e \
            --arg expected_root_mode_skip "${expected_root_mode_skip}" \
            'select(
              .Action == "skip" and
              .Package == "github.com/example/autostream-control-panel/internal/updateagent" and
              .Test == $expected_root_mode_skip
            )' \
            "${result}" > /dev/null; then
            echo "Expected root-mode updater skip did not report: ${expected_root_mode_skip}" >&2
            exit 1
          fi
          for test_prefix in "${root_tests[@]}"; do
            if ! jq -e \
              --arg test_prefix "${test_prefix}" \
              'select(
                .Action == "pass" and
                .Package == "github.com/example/autostream-control-panel/internal/updateagent" and
                ((.Test // "") | startswith($test_prefix))
              )' \
              "${result}" > /dev/null; then
              echo "Root-owned updater test did not report pass: ${test_prefix}" >&2
              exit 1
            fi
          done
          jq -e \
            'select(.Action == "pass" and
              .Package == "github.com/example/autostream-control-panel/internal/updateagent" and
              ((.Test // "") == ""))' \
            "${result}" > /dev/null
      - name: Check Host Agent installer smoke syntax
        run: |
          bash -n internal/security/testdata/run-host-agent-identity-permissions-smoke.sh
          bash -n internal/security/testdata/run-host-agent-installer-prepare-smoke.sh
          bash -n internal/security/testdata/run-host-agent-installer-upgrade-smoke.sh
      - name: Test Host Agent canonical identity with private legacy parent
        run: |
          set -euo pipefail
          smoke_dir="${RUNNER_TEMP}/host-agent-identity-permissions"
          mkdir -p "${smoke_dir}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -o "${smoke_dir}/autostream-host-agent" \
              ./cmd/autostream-host-agent
          docker run --rm \
            --user 0:0 \
            --network none \
            --pids-limit 128 \
            --memory 256m \
            --cpus 1 \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            --mount "type=bind,source=${smoke_dir},target=/smoke,readonly" \
            ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \
            /bin/bash /workspace/internal/security/testdata/run-host-agent-identity-permissions-smoke.sh \
              /smoke/autostream-host-agent
      - name: Test Host Agent prepare installer without an identity
        run: |
          docker run --rm \
            --user 0:0 \
            --network none \
            --pids-limit 128 \
            --memory 256m \
            --cpus 1 \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            --mount "type=bind,source=${RUNNER_TEMP}/host-agent-identity-permissions,target=/smoke,readonly" \
            ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \
            /bin/bash /workspace/internal/security/testdata/run-host-agent-installer-prepare-smoke.sh \
              /workspace \
              /smoke/autostream-host-agent
      - name: Test Host Agent manual upgrade installer delegation
        run: |
          set -euo pipefail
          smoke_dir="${RUNNER_TEMP}/host-agent-installer-upgrade"
          mkdir -p "${smoke_dir}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" \
              -o "${smoke_dir}/host-runtime-process-fixture" \
              ./internal/security/testdata/host-runtime-process-fixture
          docker run --rm \
            --user 0:0 \
            --network none \
            --pids-limit 128 \
            --memory 256m \
            --cpus 1 \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            --mount "type=bind,source=${smoke_dir},target=/smoke,readonly" \
            ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \
            /bin/bash /workspace/internal/security/testdata/run-host-agent-installer-upgrade-smoke.sh \
              /workspace \
              /smoke/host-runtime-process-fixture
      - name: Test backup script with root-owned Linux fixtures
        run: |
          docker run --rm \
            --user 0:0 \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 256m \
            --cpus 1 \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            ubuntu@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \
            /bin/bash /workspace/internal/security/testdata/run-backup-script-root-smoke.sh \
              /workspace/release/autostream-backup-control-panel.example \
              /var/backups/autostream/control-panel \
              autostream_control_panel \
              autostream-kometubu_panel
      - run: go build ./...

  observability_proxy_race_pre_fix:
    name: Observability proxy race pre-fix proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Initialize bounded proof artifact
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="${RUNNER_TEMP}/observability-proxy-race-pre-fix"
          install -d -m 0700 "${proof_dir}"
          printf 'status=not_run\n' > "${proof_dir}/proof.txt"
          chmod 0600 "${proof_dir}/proof.txt"
      - name: Check out current workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact pre-fix authority source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 86261a2e8b839bcf24f8b360d21b3a6c7cfc51da
          path: authority-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: authority-source/go.mod
          cache-dependency-path: authority-source/go.mod
      - name: Reproduce exact-authority Observability proxy race
        shell: bash
        env:
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          authority_sha="86261a2e8b839bcf24f8b360d21b3a6c7cfc51da"
          authority_dir="${GITHUB_WORKSPACE}/authority-source"
          current_test="${GITHUB_WORKSPACE}/internal/httpapi/server_test.go"
          authority_test="${authority_dir}/internal/httpapi/server_test.go"
          proof_dir="${RUNNER_TEMP}/observability-proxy-race-pre-fix"
          proof_log="${proof_dir}/proof.txt"
          raw_log="${RUNNER_TEMP}/observability-proxy-race-pre-fix.raw.log"
          trap 'rm -f "${raw_log}"' EXIT

          current_sha="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
          checked_out_authority_sha="$(git -C "${authority_dir}" rev-parse HEAD)"
          current_test_sha256="$(sha256sum "${current_test}" | awk '{print $1}')"
          authority_test_sha256="$(sha256sum "${authority_test}" | awk '{print $1}')"
          test_bytes_equal=false
          if cmp -s "${current_test}" "${authority_test}"; then
            test_bytes_equal=true
          fi

          {
            printf 'status=source_checked\n'
            printf 'authority_sha=%s\n' "${authority_sha}"
            printf 'checked_out_authority_sha=%s\n' "${checked_out_authority_sha}"
            printf 'current_sha=%s\n' "${current_sha}"
            printf 'current_test_sha256=%s\n' "${current_test_sha256}"
            printf 'authority_test_sha256=%s\n' "${authority_test_sha256}"
            printf 'test_bytes_equal=%s\n' "${test_bytes_equal}"
          } > "${proof_log}"

          [[ "${checked_out_authority_sha}" == "${authority_sha}" ]]
          [[ "${test_bytes_equal}" == true ]]

          set +e
          (
            cd "${authority_dir}"
            go test -race -mod=readonly -p 1 ./internal/httpapi \
              -run '^TestObservabilityProxyEndpoints$' \
              -count=20 \
              -timeout=20m
          ) > "${raw_log}" 2>&1
          race_status=$?
          set -e

          race_warning_count="$(grep -F -c 'WARNING: DATA RACE' "${raw_log}" || true)"
          target_function_count="$(grep -F -c 'TestObservabilityProxyEndpoints.func1' "${raw_log}" || true)"
          raw_log_bytes="$(wc -c < "${raw_log}")"
          {
            printf 'status=race_command_completed\n'
            printf 'go_test_exit=%s\n' "${race_status}"
            printf 'race_warning_count=%s\n' "${race_warning_count}"
            printf 'target_function_witness_count=%s\n' "${target_function_count}"
            printf 'raw_log_bytes=%s\n' "${raw_log_bytes}"
            printf 'raw_log_retained=false\n'
          } >> "${proof_log}"
          chmod 0600 "${proof_log}"

          [[ "${race_status}" -ne 0 ]]
          [[ "${race_warning_count}" -ge 1 ]]
          [[ "${target_function_count}" -ge 1 ]]
          [[ "$(wc -c < "${proof_log}")" -le 8192 ]]
      - name: Upload bounded pre-fix race proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: observability-proxy-race-pre-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observability-proxy-race-pre-fix/proof.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Test Bundle 4 Web semantic witnesses
        run: npm run test:control-platform
      - name: Test Bundle 4 browser witnesses and UI Foundation behavior
        timeout-minutes: 8
        env:
          AUTOSTREAM_BROWSER_PATH: /usr/bin/google-chrome
        run: npm run test:control-platform-browser
      - run: npm run test:system-updates
      - run: npm run test:stream-regressions
      - run: npm run lint
      - run: npm run build

  overall:
    name: overall
    if: always()
    needs: [service-installer, go, observability_proxy_race_pre_fix, web]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every blocking job
        env:
          SERVICE_INSTALLER_RESULT: ${{ needs.service-installer.result }}
          GO_RESULT: ${{ needs.go.result }}
          OBSERVABILITY_PROXY_RACE_PRE_FIX_RESULT: ${{ needs.observability_proxy_race_pre_fix.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: |
          set -euo pipefail
          [[ "${SERVICE_INSTALLER_RESULT}" == success ]]
          [[ "${GO_RESULT}" == success ]]
          [[ "${OBSERVABILITY_PROXY_RACE_PRE_FIX_RESULT}" == success ]]
          [[ "${WEB_RESULT}" == success ]]
