name: v3 CP Authorization
on:
  push:
    branches: ['v3-dev']
  pull_request:
    branches: ['v3-dev']
permissions:
  contents: read
concurrency:
  group: v3-cp-authorization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  v3-cp-authorization-checks:
    name: v3-cp-authorization-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
      GOMAXPROCS: '2'
      AUTOSTREAM_V3_AUTH_TEST_DSN: 'autostream_v3_auth_ci:synthetic-ci-only@tcp(127.0.0.1:3306)/autostream_v3_auth_ci?parseTime=true'
    services:
      mariadb:
        image: mariadb:11.4.12@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_DATABASE: autostream_v3_auth_ci
          MARIADB_USER: autostream_v3_auth_ci
          MARIADB_PASSWORD: synthetic-ci-only
          MARIADB_ROOT_PASSWORD: synthetic-ci-root-only
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: true
      - name: Toolchain and pinned evidence dependency
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.5
          test "$(go list -m -f '{{.Version}}' github.com/Kome-Lab/Autostream-Contracts/v3evidence)" = v0.0.0-20261112114129-c53da46de667
          test -z "$(go list -m -f '{{if .Replace}}{{.Replace.Path}}{{end}}' github.com/Kome-Lab/Autostream-Contracts/v3evidence)"
          go mod download github.com/Kome-Lab/Autostream-Contracts/v3evidence
      - name: Prepare reviewed Go formatting
        run: |
          set -euo pipefail
          gofmt -w internal/v3authorization/*.go internal/httpapi/server_v3_authorization*.go scripts/ci/cp_authorization_interop_test.go
          python3 - <<'PY'
          from pathlib import Path
          for path in sorted([*Path('internal/v3authorization').glob('*.go'), *Path('internal/httpapi').glob('server_v3_authorization*.go'), Path('scripts/ci/cp_authorization_interop_test.go')]):
              print('CP_FORMAT_BEGIN '+str(path))
              print(path.read_text(),end='')
              print('CP_FORMAT_END '+str(path))
          PY
      - name: CP unit and disposable MariaDB integration tests
        run: |
          set -euo pipefail
          go test -count=1 -json ./internal/v3authorization | tee "$RUNNER_TEMP/v3-cp-tests.json"
          test "$(jq -r 'select(.Action=="pass" and ((.Test//"")|startswith("TestSQLStore")))|.Test' "$RUNNER_TEMP/v3-cp-tests.json" | wc -l)" -ge 6
          ! jq -e 'select(.Action=="skip" and ((.Test//"")|startswith("TestSQLStore")))' "$RUNNER_TEMP/v3-cp-tests.json" >/dev/null
          go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: CGO-free and affected race tests
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -count=1 ./internal/v3authorization ./internal/httpapi -run 'Test(V3Authorization|Issue|ConcurrentIssuance|MissingDependencies|RevisionRace|SaveUnknown|ReadCurrent|CancellationMissing|StrictHTTP|SQLStore)'
          go test -race -count=1 ./internal/v3authorization ./internal/httpapi -run 'Test(V3Authorization|Issue|ConcurrentIssuance|MissingDependencies|RevisionRace|SaveUnknown|ReadCurrent|CancellationMissing|StrictHTTP|SQLStore)'
      - name: Existing entrypoints and Linux CGO-free cross-builds
        run: |
          set -euo pipefail
          go build ./cmd/...
          for arch in amd64 arm64; do
            mkdir -p "$RUNNER_TEMP/cp-build-$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -o "$RUNNER_TEMP/cp-build-$arch/" ./cmd/...
          done
          git diff --exit-code -- go.mod go.sum
      - name: Acquire fixed disposable C10 interop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Kome-Lab/Autostream-Updater
          ref: 6f71ee3a0906665f0a639abf69c27749ba211dc7
          path: .cp-interop-updater
          persist-credentials: false
      - name: CP Service to canonical Codec to C10 (synthetic collaborators)
        run: |
          set -euo pipefail
          export CP_INTEROP_DIR="$RUNNER_TEMP/cp-authorization-interop"
          mkdir -p "$CP_INTEROP_DIR"
          test "$(git -C .cp-interop-updater rev-parse HEAD)" = 6f71ee3a0906665f0a639abf69c27749ba211dc7
          cp scripts/ci/cp_authorization_interop_test.go .cp-interop-updater/internal/localexecutor/registry/zz_cp_producer_interop_test.go
          (cd .cp-interop-updater && go test -tags=cp_producer_interop -run '^TestCPProducerExport$' -count=1 -v ./internal/localexecutor/registry)
          go test -run '^TestCPProducerInterop$' -count=1 -v ./internal/v3authorization
          (cd .cp-interop-updater && go test -tags=cp_producer_interop -run '^TestCPProducerImport$' -count=1 -v ./internal/localexecutor/registry)
          git diff --exit-code -- go.mod go.sum
