name: Control Panel publication recovery 095
on:
  workflow_dispatch:
    inputs:
      version:
        description: Fixed original version
        required: true
        default: v2.0.0
        type: string
permissions:
  contents: read
concurrency:
  group: control-panel-release-publish-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  recover-publication:
    if: github.repository == 'Kome-Lab/Autostream-ControlPanel' && github.ref == 'refs/heads/codex/release-v2-publication-recovery-095' && inputs.version == 'v2.0.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify fixed original artifact and prepare recovery predicate
        run: python3 -B .github/scripts/recover-release-095.py prepare --work "${RUNNER_TEMP}/recovery-095"
      - name: Attest original bytes with actual recovery identity
        id: recovery-attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: |
            ${{ runner.temp }}/recovery-095/payload/autostream-control-panel_v2.0.0_linux_amd64.tar.gz
            ${{ runner.temp }}/recovery-095/payload/autostream-control-panel_v2.0.0_linux_arm64.tar.gz
            ${{ runner.temp }}/recovery-095/payload/release-manifest.json
          predicate-type: https://github.com/Kome-Lab/Autostream-ControlPanel/attestations/release-recovery/v1
          predicate-path: ${{ runner.temp }}/recovery-095/recovery-predicate.json
          github-token: ${{ github.token }}
          push-to-registry: false
      - name: Verify recovery certificate and original build linkage before publication
        run: python3 -B .github/scripts/recover-release-095.py verify-attestations --work "${RUNNER_TEMP}/recovery-095"
      - name: Publish exactly seven original files with prepared notes
        run: python3 -B .github/scripts/recover-release-095.py publish --work "${RUNNER_TEMP}/recovery-095"
