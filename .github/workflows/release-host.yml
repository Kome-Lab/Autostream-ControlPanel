name: Control Panel host release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to rehearse without publishing
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: control-panel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-host:
    name: Build Control Panel release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      push_release: ${{ steps.release-metadata.outputs.push_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require successful CI for exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_runs="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed&per_page=100" |
              jq --arg sha "${GITHUB_SHA}" \
                '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length'
          )"
          if [[ "${successful_runs}" -lt 1 ]]; then
            echo "No successful ci.yml run exists for exact release commit ${GITHUB_SHA}." >&2
            exit 1
          fi
      - id: release-metadata
        name: Resolve immutable release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            push_release=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${REQUESTED_VERSION}"
            push_release=false
          else
            echo "unsupported release trigger" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release version: ${version}" >&2
            exit 1
          fi
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'push_release=%s\n' "${push_release}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build Control Panel only archives
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: |
          bash scripts/ci/build-control-panel-release-candidate.sh \
            "${RELEASE_VERSION}" \
            "${GITHUB_SHA}" \
            "${RUNNER_TEMP}/control-panel-release"
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-panel-release-${{ steps.release-metadata.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/control-panel-release/artifacts
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-release:
    name: Publish immutable Control Panel release
    needs: release-host
    if: needs.release-host.outputs.push_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: control-panel-release-publish-${{ needs.release-host.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@96dc968c16b1e91bb81db51b7a8786906658a842 # v8.0.0
        with:
          name: control-panel-release-${{ needs.release-host.outputs.version }}-${{ github.sha }}
          path: artifacts
      - name: Verify exact Control Panel release inventory
        env:
          RELEASE_VERSION: ${{ needs.release-host.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t actual < <(find artifacts -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=(
            SHA256SUMS
            "autostream-control-panel_${RELEASE_VERSION}_linux_amd64.tar.gz"
            "autostream-control-panel_${RELEASE_VERSION}_linux_amd64.tar.gz.sha256"
            "autostream-control-panel_${RELEASE_VERSION}_linux_arm64.tar.gz"
            "autostream-control-panel_${RELEASE_VERSION}_linux_arm64.tar.gz.sha256"
            release-manifest.json
            release-manifest.json.sha256
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected release inventory:\n%s\n' "${actual[*]}" >&2
            exit 1
          fi
          (
            cd artifacts
            sha256sum --check --strict autostream-control-panel_*.tar.gz.sha256
            sha256sum --check --strict SHA256SUMS
            sha256sum --check --strict release-manifest.json.sha256
          )
      - name: Attest Control Panel archives
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: artifacts/autostream-control-panel_*.tar.gz
      - name: Attest Control Panel release manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: artifacts/release-manifest.json
      - name: Publish tag-bound release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-host.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_VERSION} already exists; publish a new version instead of mutating it." >&2
            exit 1
          fi
          gh release create "${RELEASE_VERSION}" \
            artifacts/* \
            --verify-tag \
            --title "AutoStream Control Panel ${RELEASE_VERSION}" \
            --generate-notes
