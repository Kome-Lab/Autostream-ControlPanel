          subprocess.run(["python3","-B","scripts/ci/generate_polling_source_projection.py","--root",str(pathlib.Path.cwd()),"--tree",subprocess.check_output(["git","write-tree"],text=True).strip(),"--accept-path-changes","--receipt",str(pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"operations-projection")],check=True)
          generated=json.loads(pathlib.Path("web/tests/fixtures/ui-regression/polling-current-source-delta.json").read_text())
          assert {row["path"] for row in generated["records"]}==expected
          assert len(expected)==264
          assert hashlib.sha256(pathlib.Path("web/tests/fixtures/ui-regression/polling-legacy-parity.json").read_bytes()).hexdigest()=="b2df0a26ef1f77a08a0ddbfe8762b7e77a583c21ba8ed03d22373e4ebce764a8"
          subprocess.run(["git","add","--","web/tests/fixtures/ui-regression/polling-current-source-delta.json","web/tests/ui-regression/polling-current-source-contract.mts"],check=True)
          subprocess.run(["git","-c","core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol","diff","--cached","--check"],check=True)
          subprocess.run(["git","diff","--cached","--stat"],check=True)
          print("REVIEWED_SOURCE_PATH_ADDITIONS",json.dumps(sorted(added)))
          print("REVIEWED_SOURCE_PATH_REMOVALS",json.dumps(sorted(removed)))
          PY
      - name: Read fixed status Contracts authority
        id: authority
        run: |
          python3 -B - <<'PY'
          import json,os,pathlib
          value=json.loads(pathlib.Path("web/tests/fixtures/ui-foundation-status-authority.json").read_text())
          current=next(s for s in value["authorities"] if s["id"]=="contracts")["currentSource"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output: output.write("contracts_sha="+current["revision"]+"\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Kome-Lab/Autostream-Contracts
          ref: ${{ steps.authority.outputs.contracts_sha }}
          path: status-authority-contracts
          persist-credentials: false
      - name: Place pinned status authority outside the product source tree
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          authority_root="$RUNNER_TEMP/status-authority-contracts"
          test ! -e "$authority_root"
          mv -- status-authority-contracts "$authority_root"
          printf 'AUTOSTREAM_STATUS_CONTRACTS_ROOT=%s\n' "$authority_root" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        working-directory: web
        timeout-minutes: 5
        run: npm ci
      - name: Verify authored source integrity
        run: python3 -B scripts/ci/verify_source_integrity.py --repository Autostream-ControlPanel --tree "$(git write-tree)" --out "$RUNNER_TEMP/operations-source-integrity.json"
      - name: Verify current projection and imported type closure
        working-directory: web
        run: |
          set -euo pipefail
          node --no-warnings --test --test-concurrency=1 --test-timeout=180000 tests/ui-regression/polling-current-source-delta.test.mts
          npm run typecheck:ui-regression
      - name: Report every current copy binding difference
        working-directory: web
        run: |
          node --no-warnings --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { copyBindings } from "./tests/ui-regression/current-binding.mts";
          const fixture=JSON.parse(readFileSync("tests/fixtures/ui-regression/current-copy-bindings.json","utf8"));
          const differences=[];
          for(const row of fixture.files) {
            const actual=copyBindings(readFileSync(resolve("..",row.path),"utf8"));
            if(JSON.stringify(actual)!==JSON.stringify(row.binding)) differences.push({path:row.path,expected:row.binding,actual});
          }
          console.log("CURRENT_COPY_BINDING_DIFFERENCES",JSON.stringify(differences));
          JS
      - name: Verify unresolved operations and current regression gates
        working-directory: web
        env:
          AUTOSTREAM_STATUS_CONTRACTS_ROOT: ${{ runner.temp }}/status-authority-contracts
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node --no-warnings --input-type=module <<'JS'
          import { spawnSync } from "node:child_process";
          import { captureNextGeneratedFiles, restoreNextGeneratedFiles } from "./tests/helpers/browser-harness.mts";
          const generated=captureNextGeneratedFiles(process.cwd());
          const script="import json,os,pathlib,subprocess,time\noutput=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"operations-web-gates\";output.mkdir()\nscripts=[\"test:ui-foundation-operations\",\"test:ui-regression:components\",\"test:ui-regression:browser-contracts\",\"lint\",\"test:ui-regression:parity\"]\nresults=[]\nfor script in scripts:\n    path=output/(script.replace(\":\",\"-\")+\".log\")\n    started=time.monotonic()\n    with path.open(\"w\") as log:\n        try:\n            result=subprocess.run(([\"node\",\"--no-warnings\",\"../scripts/ci/build-web-preserving-sources.mjs\"] if script==\"build\" else [\"npm\",\"run\",script]),cwd=\"web\",stdout=log,stderr=subprocess.STDOUT,timeout=900)\n            code=result.returncode\n        except subprocess.TimeoutExpired:\n            code=124\n            print(\"DIRECT_GATE_TIMEOUT\",script,flush=True)\n    row={\"script\":script,\"exit\":code,\"seconds\":round(time.monotonic()-started,3)}\n    results.append(row);print(\"DIRECT_GATE_RESULT\",json.dumps(row),flush=True)\n    lines=path.read_text(errors=\"replace\").splitlines()\n    print(\"\\n\".join(lines[-200:] if code else lines[-12:]),flush=True)\n    (output/\"results.json\").write_text(json.dumps(results,indent=2)+\"\\n\")\nraise SystemExit(0 if all(r[\"exit\"]==0 for r in results) else 1)\n";
          try {
            const child=spawnSync("python3",["-B","-c",script],{cwd:"..",stdio:"inherit"});
            if(child.error)throw child.error;
            process.exitCode=child.status??1;
          } finally { restoreNextGeneratedFiles(generated); }
          JS
      - name: Prepare fixed Japanese browser fonts
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fontconfig fonts-noto-cjk=1:20230817+repack1-3
          fc-list -q ':lang=ja'
      - name: Verify all 24 related UI cases through the moved runtime
        working-directory: web
        timeout-minutes: 7
        env:
          AUTOSTREAM_BROWSER_PATH: /usr/bin/google-chrome
          AUTOSTREAM_RELATED_UI_EVIDENCE_DIR: ${{ runner.temp }}/operations-related-evidence
