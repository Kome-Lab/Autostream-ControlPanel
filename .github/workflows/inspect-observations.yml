name: Verify complete Web operations repair
on:
  push:
    branches: ['diagnostics/part11-service-health-75bbe3c']
permissions:
  contents: read
concurrency:
  group: verify-web-operations-d430
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d4305f28fcb2ce68ee1eeecd11e1aa3e865379d0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply exact reviewed operations repair and regenerate current source layer
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,json,pathlib,subprocess
          from scripts.ci.source_policy import physical_lines
          def blob(value): return hashlib.sha1(b"blob "+str(len(value)).encode()+b"\0"+value).hexdigest()
          assert subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()=="d4305f28fcb2ce68ee1eeecd11e1aa3e865379d0"
          changes=json.loads("[{\"path\":\"web/src/features/application/updater-action-policy.ts\",\"replacements\":[{\"before\":\"@/lib/foundation/actions/bounded-revalidation\",\"after\":\"@/lib/actions/bounded-revalidation\"}],\"oldBlob\":\"15012433ea64c6153396764819ec6ebb9869b53c\"},{\"path\":\"web/src/features/resources/resource-action-controller.ts\",\"replacements\":[{\"before\":\"@/lib/foundation/actions/bounded-revalidation\",\"after\":\"@/lib/actions/bounded-revalidation\"}],\"oldBlob\":\"ddda1a1286bc9e26e3f9d82b49feecd1a39a2e17\"},{\"path\":\"web/src/features/settings/app-settings-action-policy.ts\",\"replacements\":[{\"before\":\"@/lib/foundation/actions/bounded-revalidation\",\"after\":\"@/lib/actions/bounded-revalidation\"}],\"oldBlob\":\"66ec48fd64e28481dace02b32ec073364aa436f2\"},{\"path\":\"web/src/features/streams/stream-action-controller.ts\",\"replacements\":[{\"before\":\"@/lib/foundation/actions/bounded-revalidation\",\"after\":\"@/lib/actions/bounded-revalidation\"}],\"oldBlob\":\"75115e345e4210db5a36bbca8c50556e12876d4d\"},{\"path\":\"web/src/features/streams/stream-action-runtime.ts\",\"replacements\":[{\"before\":\"@/lib/foundation/actions/bounded-revalidation\",\"after\":\"@/lib/actions/bounded-revalidation\"}],\"oldBlob\":\"6bc375b906cf61d76070b6797018d4b73202040b\"},{\"path\":\"web/src/features/streams/stream-visual-action-controller.ts\",\"replacements\":[{\"before\":\"@/lib/foundation/actions/bounded-revalidation\",\"after\":\"@/lib/actions/bounded-revalidation\"}],\"oldBlob\":\"29ba9ea664f560fc5a6c42a82271a86081a70291\"},{\"path\":\"web/src/features/workers/workers-action-controller.ts\",\"replacements\":[{\"before\":\"@/lib/foundation/actions/bounded-revalidation\",\"after\":\"@/lib/actions/bounded-revalidation\"}],\"oldBlob\":\"c5fbba412a5e9bd1bd1d21a47f6b2c3d9ec294d0\"},{\"path\":\"web/src/features/workers/workers-configuration-controller.ts\",\"replacements\":[{\"before\":\"@/lib/foundation/actions/bounded-revalidation\",\"after\":\"@/lib/actions/bounded-revalidation\"}],\"oldBlob\":\"7accb49ba967550000e14744033933e4ad878750\"},{\"path\":\"web/tests/polling-related-screens-browser.mts\",\"replacements\":[{\"before\":\"\\\"src/lib/foundation/actions/bounded-revalidation.ts\\\"\",\"after\":\"\\\"src/lib/actions/bounded-revalidation.ts\\\"\"}],\"oldBlob\":\"44bc0e79069fc37ff2f411777953be15c67b1d07\"},{\"path\":\"web/tests/helpers/ui-foundation-permission-imports.mts\",\"replacements\":[{\"before\":\"      \\\"src/features/workers/workers-action-controller.ts\\\",\",\"after\":\"      \\\"src/features/workers/workers-action-controller.ts\\\",\\n      \\\"src/features/workers/workers-action-runtime.ts\\\",\"}],\"oldBlob\":\"96332736ca23fd058a668c421a08ba53bffc10d2\"},{\"path\":\"web/tests/ui-foundation-permissions.test.mts\",\"replacements\":[{\"before\":\"    productionConsumerCount: 19,\",\"after\":\"    productionConsumerCount: 20,\"}],\"oldBlob\":\"a2b871cceeb47f234372fde71976e6b9dfdb2c37\"},{\"path\":\"web/tests/workers-restart-authority-cases.mts\",\"replacements\":[{\"before\":\"  const permissionRefreshing = restartHarness();\",\"after\":\"  const permissionRefreshing = restartHarness();\\n  permissionRefreshing.queryClient.removeQueries({ queryKey: [\\\"auth\\\", \\\"me\\\"], exact: true });\"}],\"oldBlob\":\"1e574d0ad534d7bf6a051d43e82c6435321449e8\"},{\"path\":\"web/tests/workers-action-lifecycle-cases.mts\",\"replacements\":[{\"before\":\"  const refreshing = configurationHarness();\",\"after\":\"  const refreshing = configurationHarness();\\n  refreshing.queryClient.removeQueries({ queryKey: [\\\"auth\\\", \\\"me\\\"], exact: true });\"}],\"oldBlob\":\"3c5a81f1a4ff3eee7ca2bf8ba8462d9b045353b6\"},{\"path\":\"web/tests/streams-foundation-migration.test.mts\",\"replacements\":[{\"before\":\"  \\\"  return nextResolve(specifier, context);\\\",\",\"after\":\"  \\\"  if (specifier.startsWith('.') && context.parentURL?.startsWith(webRootURL + 'src/') && !/\\\\\\\\.[cm]?[jt]sx?$/.test(specifier)) {\\\",\\n  \\\"    return nextResolve(new URL(specifier + '.ts', context.parentURL).href, context);\\\",\\n  \\\"  }\\\",\\n  \\\"  return nextResolve(specifier, context);\\\",\"}],\"oldBlob\":\"09fff1d7e1ccbe4051c57689725021608d061966\"},{\"path\":\"web/tests/ui-foundation-final-gate.test.mts\",\"replacements\":[{\"before\":\"  mutated.set(appPath, (mutated.get(appPath) || \\\"\\\").replaceAll('\\\"APP-02\\\"', '\\\"APP-X2\\\"'));\",\"after\":\"  const before = sources.get(appPath)!;\\n  assert.match(before, /\\\\bAPP-02\\\\b/u);\\n  const after = before.replaceAll(/\\\\bAPP-02\\\\b/gu, \\\"APP-X2\\\");\\n  assert.notEqual(after, before);\\n  assert.doesNotMatch(after, /\\\\bAPP-02\\\\b/u);\\n  mutated.set(appPath, after);\"}],\"oldBlob\":\"1d2f4e08329de001a35adde3960c73a4ba1b5114\"}]")
          for entry in changes:
              path=pathlib.Path(entry["path"]);data=path.read_bytes()
              assert blob(data)==entry["oldBlob"],entry["path"]
              source=data.decode("utf-8")
              for replacement in entry["replacements"]:
                  assert source.count(replacement["before"])==1,entry["path"]
                  source=source.replace(replacement["before"],replacement["after"])
              path.write_bytes(source.encode("utf-8"))
          move=json.loads("{\"before\":\"web/src/lib/foundation/actions/bounded-revalidation.ts\",\"after\":\"web/src/lib/actions/bounded-revalidation.ts\",\"blob\":\"dee332c32aa9cc00f6db39c6d24caf5794d0d31c\"}")
          before=pathlib.Path(move["before"]);after=pathlib.Path(move["after"])
          data=before.read_bytes();assert blob(data)==move["blob"] and not after.exists()
          assert subprocess.run(["git","cat-file","-e","65a601fc9d4f15c93083e9be4ab9e71586fdba69:"+move["before"]],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode!=0
          after.parent.mkdir(parents=True,exist_ok=True);after.write_bytes(data);before.unlink()
          owner_path=pathlib.Path("scripts/ci/source-owner-map.json")
          owners=json.loads(owner_path.read_text())
          reviewed={"web/tests/workers-action-lifecycle-cases.mts","web/tests/workers-restart-authority-cases.mts"}
          seen=set()
          for row in owners:
              for destination in row["destinations"]:
                  if destination["path"] not in reviewed: continue
                  assert destination["path"] not in seen
                  seen.add(destination["path"])
                  value=pathlib.Path(destination["path"]).read_bytes()
                  destination["sha256"]=hashlib.sha256(value).hexdigest()
                  destination["physical_lines"]=physical_lines(value)
          assert seen==reviewed
          owner_path.write_text(json.dumps(owners,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          subprocess.run(["git","add","--",*[entry["path"] for entry in changes],move["before"],move["after"],str(owner_path)],check=True)
          current=json.loads(pathlib.Path("web/tests/fixtures/ui-regression/polling-current-source-delta.json").read_text())
          old={row["path"] for row in current["records"]}
          added=set(json.loads("[\"web/tests/helpers/ui-foundation-permission-imports.mts\",\"web/tests/ui-foundation-permissions.test.mts\",\"web/tests/workers-restart-authority-cases.mts\",\"web/tests/streams-foundation-migration.test.mts\",\"web/tests/ui-foundation-final-gate.test.mts\",\"web/src/lib/actions/bounded-revalidation.ts\"]"));removed=set(json.loads("[\"web/src/lib/foundation/actions/bounded-revalidation.ts\"]"))
          assert len(old)==253 and not old.intersection(added) and removed.issubset(old)
          expected=(old-removed)|added
          subprocess.run(["python3","-B","scripts/ci/generate_polling_source_projection.py","--root",str(pathlib.Path.cwd()),"--tree",subprocess.check_output(["git","write-tree"],text=True).strip(),"--accept-path-changes","--receipt",str(pathlib.Path(__import__("os").environ["RUNNER_TEMP"])/"operations-projection")],check=True)
          generated=json.loads(pathlib.Path("web/tests/fixtures/ui-regression/polling-current-source-delta.json").read_text())
          assert {row["path"] for row in generated["records"]}==expected
          assert len(expected)==258
          assert hashlib.sha256(pathlib.Path("web/tests/fixtures/ui-regression/polling-legacy-parity.json").read_bytes()).hexdigest()=="b2df0a26ef1f77a08a0ddbfe8762b7e77a583c21ba8ed03d22373e4ebce764a8"
          subprocess.run(["git","add","--","web/tests/fixtures/ui-regression/polling-current-source-delta.json","web/tests/ui-regression/polling-current-source-contract.mts"],check=True)
          subprocess.run(["git","diff","--cached","--check"],check=True)
          subprocess.run(["git","diff","--cached","--stat"],check=True)
          print("REVIEWED_SOURCE_PATH_ADDITIONS",json.dumps(sorted(added)))
          print("REVIEWED_SOURCE_PATH_REMOVALS",json.dumps(sorted(removed)))
          PY
      - name: Read fixed status Contracts authority
        id: authority
        run: |
          python3 -B - <<'PY'
          import json,os,pathlib
          value=json.loads(pathlib.Path("web/tests/fixtures/ui-foundation-status-authority.json").read_text())
          current=next(s for s in value["authorities"] if s["id"]=="contracts")["currentSource"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output: output.write("contracts_sha="+current["revision"]+"\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Kome-Lab/Autostream-Contracts
          ref: ${{ steps.authority.outputs.contracts_sha }}
          path: status-authority-contracts
          persist-credentials: false
      - name: Install locked dependencies
        working-directory: web
        timeout-minutes: 5
        run: npm ci
      - name: Verify authored source integrity
        run: python3 -B scripts/ci/verify_source_integrity.py --repository Autostream-ControlPanel --tree "$(git write-tree)" --out "$RUNNER_TEMP/operations-source-integrity.json"
      - name: Verify current projection and imported type closure
        working-directory: web
        run: |
          set -euo pipefail
          node --no-warnings --test --test-concurrency=1 --test-timeout=180000 tests/ui-regression/polling-current-source-delta.test.mts
          npm run typecheck:ui-regression
      - name: Run all operation, migration, polling, and remaining Web gates
        working-directory: web
        env:
          AUTOSTREAM_STATUS_CONTRACTS_ROOT: ${{ github.workspace }}/status-authority-contracts
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node --no-warnings --input-type=module <<'JS'
          import { spawnSync } from "node:child_process";
          import { captureNextGeneratedFiles, restoreNextGeneratedFiles } from "./tests/helpers/browser-harness.mts";
          const generated=captureNextGeneratedFiles(process.cwd());
          const script="import json,os,pathlib,subprocess,time\noutput=pathlib.Path(os.environ[\"RUNNER_TEMP\"])/\"operations-web-gates\";output.mkdir()\nscripts=[\"test:ui-foundation-operations\",\"test:foundation-migrations\",\"test:polling-create-upload\",\"test:system-updates\",\"test:stream-regressions\",\"test:ui188-stream-operations\",\"lint\",\"build\",\"test:ui-regression:components\",\"test:ui-regression:parity\",\"test:ui-regression:browser-contracts\"]\nresults=[]\nfor script in scripts:\n    path=output/(script.replace(\":\",\"-\")+\".log\")\n    started=time.monotonic()\n    with path.open(\"w\") as log:\n        try:\n            result=subprocess.run([\"npm\",\"run\",script],cwd=\"web\",stdout=log,stderr=subprocess.STDOUT,timeout=900)\n            code=result.returncode\n        except subprocess.TimeoutExpired:\n            code=124\n            print(\"DIRECT_GATE_TIMEOUT\",script,flush=True)\n    row={\"script\":script,\"exit\":code,\"seconds\":round(time.monotonic()-started,3)}\n    results.append(row);print(\"DIRECT_GATE_RESULT\",json.dumps(row),flush=True)\n    lines=path.read_text(errors=\"replace\").splitlines()\n    print(\"\\n\".join(lines[-200:] if code else lines[-12:]),flush=True)\n    (output/\"results.json\").write_text(json.dumps(results,indent=2)+\"\\n\")\nraise SystemExit(0 if all(r[\"exit\"]==0 for r in results) else 1)\n";
          try {
            const child=spawnSync("python3",["-B","-c",script],{cwd:"..",stdio:"inherit"});
            if(child.error)throw child.error;
            process.exitCode=child.status??1;
          } finally { restoreNextGeneratedFiles(generated); }
          JS
      - name: Prepare fixed Japanese browser fonts
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fontconfig fonts-noto-cjk=1:20230817+repack1-3
          fc-list -q ':lang=ja'
      - name: Verify all 24 related UI cases through the moved runtime
        working-directory: web
        timeout-minutes: 7
        env:
          AUTOSTREAM_BROWSER_PATH: /usr/bin/google-chrome
          AUTOSTREAM_RELATED_UI_EVIDENCE_DIR: ${{ runner.temp }}/operations-related-evidence
          NODE_OPTIONS: --max-old-space-size=1536
          UV_THREADPOOL_SIZE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node --no-warnings --input-type=module <<'JS'
          import { spawnSync } from "node:child_process";
          import { captureNextGeneratedFiles, restoreNextGeneratedFiles } from "./tests/helpers/browser-harness.mts";
          const generated=captureNextGeneratedFiles(process.cwd());
          try {
            const child=spawnSync(process.execPath,["--no-warnings","tests/polling-related-screens-browser.mts"],{stdio:"inherit"});
            if(child.error)throw child.error;
            process.exitCode=child.status??1;
          } finally { restoreNextGeneratedFiles(generated); }
          JS
      - name: Freeze validated source payload
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          paths=json.loads("[\"scripts/ci/source-owner-map.json\",\"web/src/features/application/updater-action-policy.ts\",\"web/src/features/resources/resource-action-controller.ts\",\"web/src/features/settings/app-settings-action-policy.ts\",\"web/src/features/streams/stream-action-controller.ts\",\"web/src/features/streams/stream-action-runtime.ts\",\"web/src/features/streams/stream-visual-action-controller.ts\",\"web/src/features/workers/workers-action-controller.ts\",\"web/src/features/workers/workers-configuration-controller.ts\",\"web/src/lib/actions/bounded-revalidation.ts\",\"web/tests/fixtures/ui-regression/polling-current-source-delta.json\",\"web/tests/helpers/ui-foundation-permission-imports.mts\",\"web/tests/polling-related-screens-browser.mts\",\"web/tests/streams-foundation-migration.test.mts\",\"web/tests/ui-foundation-final-gate.test.mts\",\"web/tests/ui-foundation-permissions.test.mts\",\"web/tests/ui-regression/polling-current-source-contract.mts\",\"web/tests/workers-action-lifecycle-cases.mts\",\"web/tests/workers-restart-authority-cases.mts\"]");deletes=json.loads("[\"web/src/lib/foundation/actions/bounded-revalidation.ts\"]")
          tree=subprocess.check_output(["git","write-tree"],text=True).strip()
          staged=subprocess.check_output(["git","diff","--cached","--name-only","--no-renames"],text=True).splitlines()
          assert sorted(staged)==sorted(paths+deletes),(staged,paths+deletes)
          subprocess.run(["git","diff","--exit-code"],check=True)
          output=root/"operations-source";output.mkdir()
          manifest={"parent":"d4305f28fcb2ce68ee1eeecd11e1aa3e865379d0","base_tree":"9b687b166e54d4d1277cade183bc74fa90e4c1bc","final_tree":tree,"deletions":deletes,"files":{}}
          for path in paths:
              data=subprocess.check_output(["git","cat-file","blob",tree+":"+path])
              assert pathlib.Path(path).read_bytes()==data
              assert data.decode("utf-8").encode("utf-8")==data
              blob=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              destination=output/path;destination.parent.mkdir(parents=True,exist_ok=True);destination.write_bytes(data)
              manifest["files"][path]={"sha256":hashlib.sha256(data).hexdigest(),"git_blob":blob,"bytes":len(data)}
          assert manifest["files"]["web/src/lib/actions/bounded-revalidation.ts"]["git_blob"]=="dee332c32aa9cc00f6db39c6d24caf5794d0d31c"
          for path in deletes:
              assert not pathlib.Path(path).exists()
              assert subprocess.run(["git","cat-file","-e",tree+":"+path],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode!=0
          (output/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          print("VALIDATED_OPERATIONS_MANIFEST",json.dumps(manifest))
          PY
      - name: Upload validated source payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operations-source-${{ github.sha }}
          path: ${{ runner.temp }}/operations-source
          if-no-files-found: error
          retention-days: 7
      - name: Upload complete focused proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operations-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/operations-web-gates
            ${{ runner.temp }}/operations-source-integrity.json
            ${{ runner.temp }}/operations-projection/generation.json
            ${{ runner.temp }}/operations-related-evidence
          if-no-files-found: warn
          retention-days: 14
  prepare-source-blobs:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: operations-source-${{ github.sha }}
          path: ${{ runner.temp }}/validated-source
      - name: Verify exact payload and create immutable source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"validated-source"
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["parent"]=="d4305f28fcb2ce68ee1eeecd11e1aa3e865379d0"
          assert manifest["base_tree"]=="9b687b166e54d4d1277cade183bc74fa90e4c1bc"
          paths=json.loads("[\"scripts/ci/source-owner-map.json\",\"web/src/features/application/updater-action-policy.ts\",\"web/src/features/resources/resource-action-controller.ts\",\"web/src/features/settings/app-settings-action-policy.ts\",\"web/src/features/streams/stream-action-controller.ts\",\"web/src/features/streams/stream-action-runtime.ts\",\"web/src/features/streams/stream-visual-action-controller.ts\",\"web/src/features/workers/workers-action-controller.ts\",\"web/src/features/workers/workers-configuration-controller.ts\",\"web/src/lib/actions/bounded-revalidation.ts\",\"web/tests/fixtures/ui-regression/polling-current-source-delta.json\",\"web/tests/helpers/ui-foundation-permission-imports.mts\",\"web/tests/polling-related-screens-browser.mts\",\"web/tests/streams-foundation-migration.test.mts\",\"web/tests/ui-foundation-final-gate.test.mts\",\"web/tests/ui-foundation-permissions.test.mts\",\"web/tests/ui-regression/polling-current-source-contract.mts\",\"web/tests/workers-action-lifecycle-cases.mts\",\"web/tests/workers-restart-authority-cases.mts\"]");deletes=json.loads("[\"web/src/lib/foundation/actions/bounded-revalidation.ts\"]")
          assert sorted(manifest["files"])==sorted(paths) and manifest["deletions"]==deletes
          actual={p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}
          assert actual==set(paths)|{"manifest.json"}
          assert not any(p.is_symlink() for p in root.rglob("*"))
          assert manifest["files"]["web/src/lib/actions/bounded-revalidation.ts"]["git_blob"]=="dee332c32aa9cc00f6db39c6d24caf5794d0d31c"
          for path in paths:
              data=(root/path).read_bytes();entry=manifest["files"][path]
              assert len(data)==entry["bytes"] and len(data)<4*1024*1024
              assert hashlib.sha256(data).hexdigest()==entry["sha256"]
              assert data.decode("utf-8").encode("utf-8")==data
              blob=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              assert blob==entry["git_blob"]
              body={"content":base64.b64encode(data).decode("ascii"),"encoding":"base64"}
              response=json.loads(subprocess.check_output(["gh","api","--method","POST","/repos/Kome-Lab/Autostream-ControlPanel/git/blobs","--input","-"],input=json.dumps(body).encode()))
              assert response["sha"]==blob
              print("PREPARED_BLOB",json.dumps({"path":path,**entry}))
          print("PREPARED_TREE",manifest["final_tree"])
          print("PREPARED_PARENT",manifest["parent"])
          print("PREPARED_DELETIONS",json.dumps(manifest["deletions"]))
          PY
