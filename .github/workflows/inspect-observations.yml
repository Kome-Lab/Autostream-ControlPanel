name: Inventory remaining Web gates
on:
  push:
    branches: ['diagnostics/part11-service-health-75bbe3c']
permissions:
  contents: read
concurrency:
  group: inventory-web-d430
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d4305f28fcb2ce68ee1eeecd11e1aa3e865379d0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Inventory bounded runtime references
        run: |
          git grep -n 'bounded-revalidation' -- ':!web/tests/fixtures/ui-regression/*.json' ':!docs/source-owner-map.json'
          python3 -B - <<'PY'
          import json,os,pathlib
          value=json.loads(pathlib.Path("web/tests/fixtures/ui-foundation-status-authority.json").read_text())
          current=next(s for s in value["authorities"] if s["id"]=="contracts")["currentSource"]
          print("STATUS_CONTRACTS_SHA",current["revision"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output: output.write("contracts_sha="+current["revision"]+"\n")
          PY
        id: authority
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Kome-Lab/Autostream-Contracts
          ref: ${{ steps.authority.outputs.contracts_sha }}
          path: status-authority-contracts
          persist-credentials: false
      - name: Install locked dependencies
        working-directory: web
        timeout-minutes: 5
        run: npm ci
      - name: Run every remaining Web gate and retain its direct result
        env:
          AUTOSTREAM_STATUS_CONTRACTS_ROOT: ${{ github.workspace }}/status-authority-contracts
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          python3 -B - <<'PY'
          import json,os,pathlib,subprocess,time
          output=pathlib.Path(os.environ["RUNNER_TEMP"])/"remaining-web-gates";output.mkdir()
          scripts=["test:system-updates","test:stream-regressions","test:ui188-stream-operations","lint","build","test:ui-regression:components","test:ui-regression:parity","test:ui-regression:browser-contracts"]
          results=[]
          for script in scripts:
              path=output/(script.replace(":","-")+".log")
              started=time.monotonic()
              with path.open("w") as log:
                  try:
                      result=subprocess.run(["npm","run",script],cwd="web",stdout=log,stderr=subprocess.STDOUT,timeout=900)
                      code=result.returncode
                  except subprocess.TimeoutExpired:
                      code=124
                      print("DIRECT_GATE_TIMEOUT",script,flush=True)
              row={"script":script,"exit":code,"seconds":round(time.monotonic()-started,3)}
              results.append(row)
              print("DIRECT_GATE_RESULT",json.dumps(row),flush=True)
              lines=path.read_text(errors="replace").splitlines()
              if code:
                  print("\n".join(lines[-200:]),flush=True)
              else:
                  print("\n".join(lines[-12:]),flush=True)
              (output/"results.json").write_text(json.dumps(results,indent=2)+"\n")
          raise SystemExit(0 if all(r["exit"]==0 for r in results) else 1)
          PY
      - name: Upload every direct gate result and full log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remaining-web-gates-${{ github.sha }}
          path: ${{ runner.temp }}/remaining-web-gates
          if-no-files-found: error
          retention-days: 14
