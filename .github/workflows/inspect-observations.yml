          UV_THREADPOOL_SIZE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node --no-warnings --input-type=module <<'JS'
          import { spawnSync } from "node:child_process";
          import { captureNextGeneratedFiles, restoreNextGeneratedFiles } from "./tests/helpers/browser-harness.mts";
          const generated=captureNextGeneratedFiles(process.cwd());
          try {
            const child=spawnSync(process.execPath,["--no-warnings","tests/polling-related-screens-browser.mts"],{stdio:"inherit"});
            if(child.error)throw child.error;
            process.exitCode=child.status??1;
          } finally { restoreNextGeneratedFiles(generated); }
          JS
      - name: Freeze validated source payload
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          paths=json.loads("[\".github/workflows/ci.yml\",\"scripts/ci/build-web-preserving-sources.mjs\",\"scripts/ci/source-owner-map.json\",\"web/src/features/application/application-authority-readers.ts\",\"web/src/features/application/updater-action-policy.ts\",\"web/src/features/application/updater-bootstrap-authority-refresh.ts\",\"web/src/features/application/updater-bootstrap-submission-preflight.ts\",\"web/src/features/application/updater-settings-form.tsx\",\"web/src/features/application/updater-settings-panel.tsx\",\"web/src/features/nodes/node-metadata-edit.ts\",\"web/src/features/resources/resource-action-controller.ts\",\"web/src/features/settings/app-settings-action-policy.ts\",\"web/src/features/streams/stream-action-controller.ts\",\"web/src/features/streams/stream-action-runtime.ts\",\"web/src/features/streams/stream-control-platform-panel.tsx\",\"web/src/features/streams/stream-visual-action-controller.ts\",\"web/src/features/workers/workers-action-controller.ts\",\"web/src/features/workers/workers-configuration-controller.ts\",\"web/src/lib/actions/bounded-revalidation.ts\",\"web/tests/fixtures/ui-regression/current-copy-bindings.json\",\"web/tests/fixtures/ui-regression/polling-current-source-delta.json\",\"web/tests/helpers/ui-foundation-contract-imports.mts\",\"web/tests/helpers/ui-foundation-permission-imports.mts\",\"web/tests/polling-live-cover-authority.test.mts\",\"web/tests/polling-related-screens-browser.mts\",\"web/tests/stream-operations-convergence.test.mts\",\"web/tests/streams-foundation-migration.test.mts\",\"web/tests/ui-foundation-final-gate.test.mts\",\"web/tests/ui-foundation-permissions.test.mts\",\"web/tests/ui-regression/draft-exit.test.mts\",\"web/tests/ui-regression/polling-current-source-contract.mts\",\"web/tests/ui-regression/stream-detail.test.mts\",\"web/tests/workers-action-lifecycle-cases.mts\",\"web/tests/workers-restart-authority-cases.mts\",\"web/tests/youtube-output-static-relay.test.mts\"]");deletes=json.loads("[\"web/src/lib/foundation/actions/bounded-revalidation.ts\"]")
          tree=subprocess.check_output(["git","write-tree"],text=True).strip()
          staged=subprocess.check_output(["git","diff","--cached","--name-only","--no-renames"],text=True).splitlines()
          assert sorted(staged)==sorted(paths+deletes),(staged,paths+deletes)
          subprocess.run(["git","diff","--exit-code"],check=True)
          output=root/"operations-source";output.mkdir()
          manifest={"parent":"d4305f28fcb2ce68ee1eeecd11e1aa3e865379d0","base_tree":"9b687b166e54d4d1277cade183bc74fa90e4c1bc","final_tree":tree,"deletions":deletes,"files":{}}
          for path in paths:
              data=subprocess.check_output(["git","cat-file","blob",tree+":"+path])
              assert pathlib.Path(path).read_bytes()==data
              assert data.decode("utf-8").encode("utf-8")==data
              blob=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              destination=output/path;destination.parent.mkdir(parents=True,exist_ok=True);destination.write_bytes(data)
              manifest["files"][path]={"sha256":hashlib.sha256(data).hexdigest(),"git_blob":blob,"bytes":len(data)}
          assert manifest["files"]["web/src/lib/actions/bounded-revalidation.ts"]["git_blob"]=="dee332c32aa9cc00f6db39c6d24caf5794d0d31c"
          for path in deletes:
              assert not pathlib.Path(path).exists()
              assert subprocess.run(["git","cat-file","-e",tree+":"+path],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode!=0
          (output/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          print("VALIDATED_OPERATIONS_MANIFEST",json.dumps(manifest))
          PY
      - name: Upload validated source payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: operations-source-${{ github.sha }}
          path: ${{ runner.temp }}/operations-source
