name: Inspect failed P3 upload boundary
on:
  push:
    branches: ['diagnostics/part11-service-health-75bbe3c']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect only the recorded safe initial-render diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import io,json,subprocess,zipfile
          metadata=json.loads(subprocess.check_output(["gh","api","/repos/Kome-Lab/Autostream-ControlPanel/actions/artifacts/13264532585"]))
          assert metadata["workflow_run"]["id"]==41698993872 and metadata["workflow_run"]["head_sha"]=="8fe7abd08f11a942087ea8926efc41ac755272a7"
          body=subprocess.check_output(["gh","api","/repos/Kome-Lab/Autostream-ControlPanel/actions/artifacts/13264532585/zip"])
          with zipfile.ZipFile(io.BytesIO(body)) as archive:
              names=[name for name in archive.namelist() if name.endswith(".json")]
              print("EVIDENCE_JSON_PATHS",json.dumps(names),flush=True)
              for name in names:
                  if not name.endswith("initial-render-diagnostic.json"): continue
                  data=archive.read(name);assert len(data)<300000
                  value=json.loads(data)
                  print("P3_INITIAL_DIAGNOSTIC",json.dumps({"path":name,"data":value}),flush=True)
          PY
