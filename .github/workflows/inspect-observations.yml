name: Inspect failed browser observations
on:
  push:
    branches: ['diagnostics/part11-service-health-75bbe3c']
permissions:
  actions: read
  contents: read
concurrency:
  group: inspect-service-health-75bbe3c
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read failed observation JSON
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Kome-Lab/Autostream-ControlPanel
        shell: bash
        run: |
          set -euo pipefail
          for artifact in 13252432585 13252577685; do
          gh api "/repos/Kome-Lab/Autostream-ControlPanel/actions/artifacts/$artifact/zip" > "$RUNNER_TEMP/observation-$artifact.zip"
          python3 - "$RUNNER_TEMP/observation-$artifact.zip" "$artifact" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              print("ARTIFACT_ID", sys.argv[2])
              selected = [i for i in archive.infolist() if i.filename.endswith(("execution.json", "receipt.json"))]
              print("EXECUTION_FILES", json.dumps([i.filename for i in selected]))
              for info in selected:
                  assert info.file_size <= 4 * 1024 * 1024
                  value = json.loads(archive.read(info))
                  print("EXECUTION", info.filename, "source", value.get("source"), "expected", value.get("expected", value.get("expected_cases")))
                  rows = value.get("results", value.get("cases", []))
                  failed = [x for x in rows if x.get("status") != "PASS"]
                  print("SUMMARY", json.dumps({"rows": len(rows), "failed": len(failed)}))
                  for row in failed[:16]:
                      print("FAILED_OBSERVATION", json.dumps(row, ensure_ascii=False)[:12000])
              failures = [i for i in archive.infolist() if i.filename.endswith(".json") and any(k in i.filename.lower() for k in ("failure", ".error."))]
              print("FAILURE_FILES", json.dumps([i.filename for i in failures][:30]))
              for info in failures[:8]:
                  assert info.file_size <= 1024 * 1024
                  value = json.loads(archive.read(info))
                  print("FAILURE_DETAIL", info.filename, json.dumps(value, ensure_ascii=False)[:16000])
          PY
          done
