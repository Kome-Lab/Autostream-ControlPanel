name: UI188 source and harness preflight

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ui188-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - name: Verify current authored source and raw distributions
        run: python3 -B scripts/ci/verify_source_integrity.py --repository Autostream-ControlPanel --tree "$(git rev-parse HEAD)"
      - name: Restore and verify the immutable UI188 historical product fixture
        run: python3 -B scripts/ci/ui188_historical_fixture.py --root . --destination "$RUNNER_TEMP/ui188-historical-cp"
      - name: Exercise historical positive and rejection contracts without live services
        run: python3 -B -m unittest discover -s "$RUNNER_TEMP/ui188-historical-cp/scripts/ci/ui188-full-e2e" -p 'test_*.py' -v
      - name: Confirm historical checks did not modify current product source
        run: git diff --exit-code HEAD --

  linux-bootstrap:
    if: github.event_name == 'push' && github.repository == 'Kome-Lab/Autostream-ControlPanel' && github.ref == 'refs/heads/fix/part5-ui-188-release-integration-actions' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 2GiB
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: cp
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Kome-Lab/Autostream-DiscordBot
          ref: ea32df776c07119c6c4199d3db69971a1fd6686f
          persist-credentials: false
          path: bot
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.26.5'
          cache: false
      - name: Short Linux privilege and producer contract smoke
        working-directory: cp
        env:
          UI188_SMOKE_BOT_ROOT: ${{ github.workspace }}/bot
        run: python3 -B scripts/ci/ui188-full-e2e/linux_smoke.py
      - name: Upload only the closed smoke summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ui188-contract-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: cp/ui188-smoke-public/summary.json
          if-no-files-found: error
          retention-days: 1
