name: Shared Node selection validation

on:
  push:
    branches: ["codex/node-selection-sharing-20261106-01"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-sharing-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-node-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: "2"
      AUTOSTREAM_MARIADB_TEST_DSN: root:node-sharing-ci-root@tcp(127.0.0.1:3306)/autostream_ci?parseTime=true
    services:
      mariadb:
        image: mariadb:11.4.12@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7
        env:
          MARIADB_DATABASE: autostream_ci
          MARIADB_ROOT_PASSWORD: node-sharing-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check changed Go formatting
        id: goformat
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only f7a086b993cfc242a31a21c0a975eff0e3939de8 -- '*.go')
          if (( ${#files[@]} > 0 )); then
            fmt_status=0
            diff="$(gofmt -d "${files[@]}")" || fmt_status=$?
            printf '%s\n' "$diff"
            if [[ -n "$diff" || "$fmt_status" -ne 0 ]]; then
              exit 1
            fi
          fi
      - name: Run real Memory and MariaDB selection and ownership regressions
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          go test -race -timeout 5m -p 1 ./internal/store \
            -run '^Test((Memory|MariaDB)(SharedNodeSelections|SelectedStartClaims|ArchiveRunSource|ExplicitNodeSelection|VCWaitingCreateRevalidatesProfileAndCurrentSnapshot|ArchiveAuthorityRequiresExactV2Report)|DiscordWaitingCredential)' \
            -count=1 -json | tee "${RUNNER_TEMP}/node-sharing-store.json"
      - name: Run real MariaDB selection migration regressions
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          go test -timeout 5m -p 1 ./internal/database -run '^TestMariaDB(NodeSelection|ControlPlatformFeatureMigrationAndPersistence)' -count=1 -json | tee "${RUNNER_TEMP}/node-sharing-migrations.json"
      - name: Run startup activation HTTP and worker gates
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          go test -timeout 2m -p 1 ./cmd/control-panel -run '^TestNodeSelectionActivation' -count=1 -json | tee "${RUNNER_TEMP}/node-sharing-activation.json"
      - name: Require positive recovery compatibility evidence
        if: success() || failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          required = {
              "node-sharing-migrations.json": [
                  "TestMariaDBNodeSelectionActivationRollbackEditAndRetry",
                  "TestMariaDBNodeSelectionActivationRestartAndTerminalHold",
                  "TestMariaDBNodeSelectionActivationRejectsChangedAuthority",
                  "TestMariaDBNodeSelectionActivationPreparationIsAtomic",
                  "TestMariaDBNodeSelectionActivationManualAndMissingProvenance",
                  "TestMariaDBNodeSelectionActivationSuccessRequiresProof",
              ],
              "node-sharing-activation.json": [
                  "TestNodeSelectionActivationBlocksApplicationBeforeSuccess",
                  "TestNodeSelectionActivationKeepsExactRecoveryProtocol",
                  "TestNodeSelectionActivationDefersFirstBackgroundWork",
              ],
          }
          for filename, names in required.items():
              events = [json.loads(line) for line in (Path(os.environ["RUNNER_TEMP"]) / filename).read_text().splitlines()]
              for name in names:
                  actions = [event.get("Action") for event in events if event.get("Test") == name]
                  assert actions.count("run") == 1 and actions.count("pass") == 1, (name, actions)
                  assert not any(action in ("fail", "skip") for action in actions), (name, actions)
          print("NODE_SELECTION_RECOVERY_COMPATIBILITY_PASS")
          PY
      - name: Run HTTP save and refresh regression
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          go test -race -timeout 5m -p 1 ./internal/httpapi \
            -run '^Test(SharedNodeSelection|DiscordWaitingMonitor|NodeSelectionServiceAuthority|ServiceStart|CreateStreamSavesSharedDiscord|CreateStreamPreservesActive|CreateStreamParallel|UpdateStreamSettingsRejectsInvalidSelection|UpdateStreamSettingsExplicitEmpty|UI188CreateMandatoryRolesPermissionAndAtomicNodeSelections)' \
            -count=1 -json | tee "${RUNNER_TEMP}/node-sharing-http.json"
      - name: Run complete ordinary Go test suite
        if: success()
        env:
          AUTOSTREAM_MARIADB_TEST_DSN: ""
        shell: bash
        run: |
          set -euo pipefail
          go test -timeout 12m -p 1 ./... -count=1 -json | tee "${RUNNER_TEMP}/node-sharing-all-go.json"
      - name: Build Linux Control Panel
        if: success() || failure()
        run: CGO_ENABLED=0 go build -p 1 ./cmd/control-panel
      - name: Verify current source owners and physical source limits
        if: success() || failure()
        run: python3 scripts/ci/verify_source_integrity.py --repository Autostream-ControlPanel --tree "${GITHUB_SHA}" --out "${RUNNER_TEMP}/node-sharing-source-integrity.json"
      - name: Preserve regression observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-sharing-regressions-${{ github.sha }}
          path: ${{ runner.temp }}/node-sharing-*.json
          if-no-files-found: error

  shared-node-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Read the pinned Contracts authority for status vocabulary verification
        id: authority
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          data = json.loads(Path("web/tests/fixtures/ui-foundation-status-authority.json").read_text(encoding="utf-8"))
          current = next(item for item in data["authorities"] if item["id"] == "contracts")["currentSource"]
          assert current["objectKind"] == "commit" and re.fullmatch(r"[0-9a-f]{40}", current["revision"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("contracts_sha=" + current["revision"] + "\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Kome-Lab/Autostream-Contracts
          ref: ${{ steps.authority.outputs.contracts_sha }}
          path: status-authority-contracts
          persist-credentials: false
      - name: Keep authority sources outside the product tree
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          authority_root="$RUNNER_TEMP/node-sharing-status-authority-contracts"
          test ! -e "$authority_root"
          mv -- status-authority-contracts "$authority_root"
          printf 'AUTOSTREAM_STATUS_CONTRACTS_ROOT=%s\n' "$authority_root" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck:ui-regression
      - run: npm run test:stream-create
      - run: npm run test:ui-foundation-operations
      - run: npm run lint
      - name: Build actual web sources without source mutation
        run: node --no-warnings ../scripts/ci/build-web-preserving-sources.mjs
      - name: Verify current shared selection and all component views
        run: npm run test:ui-regression:components

  current-source-projection:
    needs: [shared-node-regressions, shared-node-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify successful checks for this exact source
        env:
          CI_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request

          repo = "Kome-Lab/Autostream-ControlPanel"
          branch = "codex/node-selection-sharing-20261106-01"
          current = os.environ["GITHUB_SHA"]
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_REF"] == "refs/heads/" + branch
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == current
          headers = {"Authorization": "Bearer " + os.environ["CI_READ_TOKEN"], "Accept": "application/vnd.github+json"}
          def fetch(path):
              request = urllib.request.Request("https://api.github.com/repos/" + repo + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          run_id = int(os.environ["GITHUB_RUN_ID"])
          run = fetch("/actions/runs/" + str(run_id))
          assert run["head_sha"] == current and run["head_branch"] == branch
          assert run["path"].split("@")[0] == ".github/workflows/node-sharing-validation.yml"
          required = {"shared-node-regressions", "shared-node-ui"}
          jobs = fetch("/actions/runs/" + str(run_id) + "/jobs?filter=latest&per_page=100")
          assert jobs["total_count"] <= 100
          passed = [job for job in jobs["jobs"] if job["name"] in required]
          assert len(passed) == len(required) and {job["name"] for job in passed} == required
          assert all(job["status"] == "completed" and job["conclusion"] == "success" for job in passed)
          report = {
              "source_sha": current, "run_id": run_id, "current_source_verified": True,
              "passed_jobs": [{"id": job["id"], "name": job["name"], "url": job["html_url"]} for job in passed],
              "fresh_current_and_legacy_parity_required": True,
          }
          (Path(os.environ["RUNNER_TEMP"]) / "node-sharing-parent-ci-gate.json").write_text(json.dumps(report, indent=2) + "\n")
          print("NODE_SHARING_PARENT_CHECKS " + json.dumps(report), flush=True)
          PY
      - name: Generate only the current source projection and record its commit
        id: projection
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          root = Path.cwd()
          branch = "codex/node-selection-sharing-20261106-01"
          assert os.environ["GITHUB_REPOSITORY"] == "Kome-Lab/Autostream-ControlPanel"
          assert os.environ["GITHUB_REF"] == "refs/heads/" + branch
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          source = os.environ["GITHUB_SHA"]
          assert git("rev-parse", "HEAD") == source
          assert not git("status", "--porcelain", "--untracked-files=no")
          paths = [
              "web/tests/fixtures/ui-regression/polling-current-source-delta.json",
              "web/tests/ui-regression/polling-current-source-contract.mts",
          ]
          legacy = root / "web/tests/fixtures/ui-regression/polling-legacy-parity.json"
          legacy_before = legacy.read_bytes()
          source_tree = git("rev-parse", source + "^{tree}")
          result = subprocess.run([
              sys.executable, "scripts/ci/generate_polling_source_projection.py",
              "--root", str(root), "--tree", source_tree,
              "--accept-path-changes",
              "--receipt", str(Path(os.environ["RUNNER_TEMP"]) / "node-sharing-projection"),
          ], text=True, capture_output=True, check=True)
          if result.stderr:
              print(result.stderr, file=sys.stderr)
          assert legacy.read_bytes() == legacy_before, "Frozen legacy inventory changed"
          changed = set(filter(None, git("diff", "--name-only").splitlines()))
          assert changed <= set(paths), "Generator changed a non-current source path"
          if changed:
              subprocess.run(["git", "add", "--", *paths], check=True)
              staged = set(filter(None, git("diff", "--cached", "--name-only").splitlines()))
              assert staged == changed
              subprocess.run([
                  "git", "-c", "user.name=github-actions[bot]",
                  "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit", "-m", "Refresh reviewed current source projection for shared Node selections",
              ], check=True)
          projected = git("rev-parse", "HEAD")
          assert set(filter(None, git("diff", "--name-only", source, projected).splitlines())) == changed
          report = {
              "source_sha": source, "source_tree": source_tree,
              "projection_sha": projected, "changed_paths": sorted(changed),
              "legacy_unchanged": True, "generation": json.loads(result.stdout),
              "files": [{"path": p, "sha256": hashlib.sha256((root / p).read_bytes()).hexdigest()} for p in paths],
          }
          (Path(os.environ["RUNNER_TEMP"]) / "node-sharing-projection-summary.json").write_text(json.dumps(report, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("projection_sha=" + projected + "\n")
          print("NODE_SHARING_VERIFIED_PROJECTION " + json.dumps(report), flush=True)
          PY
      - name: Read the pinned Contracts authority for status vocabulary verification
        id: authority
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          data = json.loads(Path("web/tests/fixtures/ui-foundation-status-authority.json").read_text(encoding="utf-8"))
          current = next(item for item in data["authorities"] if item["id"] == "contracts")["currentSource"]
          assert current["objectKind"] == "commit" and re.fullmatch(r"[0-9a-f]{40}", current["revision"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("contracts_sha=" + current["revision"] + "\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Kome-Lab/Autostream-Contracts
          ref: ${{ steps.authority.outputs.contracts_sha }}
          path: status-authority-contracts
          persist-credentials: false
      - name: Keep authority sources outside the product tree
        run: |
          set -euo pipefail
          authority_root="$RUNNER_TEMP/node-sharing-status-authority-contracts"
          test ! -e "$authority_root"
          mv -- status-authority-contracts "$authority_root"
          printf 'AUTOSTREAM_STATUS_CONTRACTS_ROOT=%s\n' "$authority_root" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: web
      - name: Verify the exact generated commit source owners
        run: python3 scripts/ci/verify_source_integrity.py --repository Autostream-ControlPanel --tree "${{ steps.projection.outputs.projection_sha }}"
      - name: Verify current source and the complete immutable legacy parity
        run: npm run test:ui-regression:parity
        working-directory: web
      - name: Verify unchanged status vocabularies through the current source projection
        run: node --no-warnings --test tests/ui-foundation-status.test.mts
        working-directory: web
      - name: Publish only the verified projection to this isolated feature branch
        env:
          PROJECTION_SHA: ${{ steps.projection.outputs.projection_sha }}
          PROJECTION_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import urllib.request

          repo = "Kome-Lab/Autostream-ControlPanel"
          branch = "codex/node-selection-sharing-20261106-01"
          source, projected = os.environ["GITHUB_SHA"], os.environ["PROJECTION_SHA"]
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_REF"] == "refs/heads/" + branch
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("rev-parse", "HEAD") == projected
          assert not git("status", "--porcelain", "--untracked-files=no")
          allowed = {
              "web/tests/fixtures/ui-regression/polling-current-source-delta.json",
              "web/tests/ui-regression/polling-current-source-contract.mts",
          }
          assert set(filter(None, git("diff", "--name-only", source, projected).splitlines())) <= allowed
          token = os.environ.pop("PROJECTION_GITHUB_TOKEN")
          def remote_head():
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/git/ref/heads/" + branch,
                  headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)["object"]["sha"]
          assert remote_head() == source, "Feature branch advanced; projection writeback refused"
          if projected != source:
              encoded = base64.b64encode(("x-access-token:" + token).encode()).decode()
              print("::add-mask::" + encoded, flush=True)
              result = subprocess.run([
                  "git", "-c", "credential.helper=",
                  "-c", "http.https://github.com/.extraheader=AUTHORIZATION: basic " + encoded,
                  "push", "https://github.com/" + repo + ".git", "HEAD:refs/heads/" + branch,
              ])
              if result.returncode:
                  sys.exit(result.returncode)
          assert remote_head() == projected, "Projection branch readback did not match the verified commit"
          report_path = Path(os.environ["RUNNER_TEMP"]) / "node-sharing-projection-summary.json"
          report = json.loads(report_path.read_text())
          report["published_sha"] = projected
          report_path.write_text(json.dumps(report, indent=2) + "\n")
          print("NODE_SHARING_PROJECTION_PUBLISHED " + projected, flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Product source: " + source + "\n\nVerified projection commit: " + projected + "\n")
          PY
      - name: Preserve exact projection generation and verification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: node-sharing-current-projection-${{ github.sha }}
          path: |
            ${{ runner.temp }}/node-sharing-parent-ci-gate.json
            ${{ runner.temp }}/node-sharing-projection-summary.json
            ${{ runner.temp }}/node-sharing-projection/
          if-no-files-found: warn
