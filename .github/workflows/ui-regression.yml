name: UI regression
on:
  workflow_call:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node scripts/ci/ui-regression/export-provenance.mjs
      - id: matrix
        run: node scripts/ci/ui-regression/matrix.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-regression-export-${{ github.sha }}-${{ github.run_attempt }}
          path: web/out/
          if-no-files-found: error
          retention-days: 3
  browser:
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.export.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Prepare fixed Japanese fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fontconfig fonts-noto-cjk=1:20230817+repack1-3
          fc-list -q ':lang=ja'
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ui-regression-export-${{ github.sha }}-${{ github.run_attempt }}
          path: web/out/
      - name: Observe current production UI and enforce exact shard inventory
        working-directory: web
        env:
          AUTOSTREAM_BROWSER_PATH: /usr/bin/google-chrome
          AUTOSTREAM_UI_REGRESSION_OUTPUT: ${{ runner.temp }}/ui-regression-${{ matrix.family }}
        run: npm run test:ui-regression:browser -- "${{ matrix.family }}"
      - name: Preserve raw observations including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-regression-observations-${{ matrix.family }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-regression-${{ matrix.family }}/
          if-no-files-found: error
          retention-days: 14
  source-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: b266aabb896f0df9880a0354c1135130d6938e8d
          fetch-depth: 0
          path: historical-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: historical-source/web/package-lock.json
      - run: npm ci
        working-directory: historical-source/web
      - name: Install current residual adapter dependencies
        run: npm ci
        working-directory: web
      - name: Verify immutable residual counts and locator negatives
        working-directory: web
        env:
          AUTOSTREAM_UI_HISTORY_ROOT: ${{ github.workspace }}/historical-source
        run: npm run test:ui-regression:history
      - name: Preserve source-specific historical characterization
        working-directory: historical-source/web
        run: npm run test:bundle9-ui-characterization && npm run test:bundle9-source-composition
      - name: Verify original comparison and diagnostic caller cases at their fixed source
        timeout-minutes: 2
        working-directory: historical-source/web
        run: npm run test:bundle9-browser-contracts && node --no-warnings --test tests/helpers/browser-fetch-generation-diagnostics.test.mts
      - name: Prepare fixed Japanese fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fontconfig fonts-noto-cjk=1:20230817+repack1-3
          fc-list -q ':lang=ja'
      - name: Compare immutable historical sources without changing workflow SHA
        timeout-minutes: 35
        env:
          AUTOSTREAM_BROWSER_PATH: /usr/bin/google-chrome
        run: node scripts/ci/ui-regression/historical-comparison.mjs historical-source "${{ runner.temp }}/ui-regression-history"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-regression-history-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ui-regression-history/*.json
            ${{ runner.temp }}/ui-regression-history/*.log
            ${{ runner.temp }}/ui-regression-history/before/*.json
            ${{ runner.temp }}/ui-regression-history/before/*.png
            ${{ runner.temp }}/ui-regression-history/after/*.json
            ${{ runner.temp }}/ui-regression-history/after/*.png
          if-no-files-found: error
          retention-days: 14
  required:
    if: always()
    needs: [export, browser, source-history]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source and browser shard
        env:
          EXPORT_RESULT: ${{ needs.export.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          HISTORY_RESULT: ${{ needs.source-history.result }}
        run: |
          set -euo pipefail
          [[ "$EXPORT_RESULT" == success ]]
          [[ "$BROWSER_RESULT" == success ]]
          [[ "$HISTORY_RESULT" == success ]]
