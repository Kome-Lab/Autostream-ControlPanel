services:
  db:
    cpus: 0.5
    mem_limit: 512m
  runtime:
    cpus: 1.0
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128
    shm_size: 32m
    environment:
      UI188_BOOTSTRAP_ONLY: '1'
  worker-b:
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      UI188_BOOTSTRAP_ONLY: '1'
